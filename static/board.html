<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みまもりくん — 一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="/static/theme.js"></script>
<script src="/static/who.js" defer></script>
<style>
:root{
  --paper:#F6F6F1;--surface:#fff;--surface-2:#FBFBF7;
  --ink:#191C1B;--ink-2:#4A524F;--ink-3:#7C8783;
  --line:#DCDED6;--line-strong:#C3C8BF;
  --accent:#0F6B62;--accent-soft:#E2F0ED;
  --late:#B3402015;--late-line:#B94F2B;--late-ink:#963C1E;
  --kidA:#2F6690;--kidA-soft:#E3EDF4;
  --kidB:#8A5A2B;--kidB-soft:#F4EBDF;
  --shadow:0 1px 2px rgba(25,28,27,.05),0 8px 24px -18px rgba(25,28,27,.3);
}
:root[data-theme="dark"]{
  --paper:#101413;--surface:#191E1D;--surface-2:#151A19;
  --ink:#ECEFEB;--ink-2:#AFB9B5;--ink-3:#7E8A86;
  --line:#2A3231;--line-strong:#3A4442;
  --accent:#5FCFC0;--accent-soft:#14302C;
  --late:#B9502B20;--late-line:#E8926B;--late-ink:#E8926B;
  --kidA:#8FBEDD;--kidA-soft:#1B2C38;
  --kidB:#D5AC7C;--kidB-soft:#312619;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
 font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr{max-width:860px;margin:0 auto;padding:13px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:"Zen Old Mincho",serif;font-size:19px;margin:0;letter-spacing:.05em}
.date{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.nav{flex-basis:100%;display:flex;gap:6px;overflow-x:auto}
.nav a{flex:none;font-size:12.5px;text-decoration:none;padding:4px 12px;white-space:nowrap;
 border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-2)}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.theme{margin-left:auto;flex:none;font:inherit;font-size:12.5px;padding:4px 12px;white-space:nowrap;
 border:1px solid var(--line-strong);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer}

.demo{background:#F6E8C6;color:#7A5A10;font-size:12px;text-align:center;padding:5px}
:root[data-theme="dark"] .demo{background:#33290F;color:#E0C583}

.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:16px 0 6px}
.filters button{font:inherit;font-size:12.5px;padding:4px 13px;border:1px solid var(--line-strong);
 background:transparent;color:var(--ink-2);border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.pts{margin-left:auto;display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);align-items:center}
.pt{border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--surface)}
.pt b{font-family:"IBM Plex Mono",monospace;font-size:13px}

/* 子が入れたものの知らせ（D-62） */
#notice{margin:12px 0 0;padding:11px 13px;border:1px solid var(--accent);border-radius:12px;
 background:var(--accent-soft)}
#notice[hidden]{display:none}
#notice .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#notice .hd b{font-size:14px}
#notice .hd .when{font-size:12px;color:var(--ink-3)}
#notice .hd .seen{margin-left:auto;font:inherit;font-size:12.5px;padding:4px 11px;cursor:pointer;
 border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink-2)}
#notice ul{margin:7px 0 0;padding:0;list-style:none}
#notice li{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:2px 0}
#notice li button{font:inherit;font-size:12px;padding:2px 9px;cursor:pointer;border-radius:7px;
 border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3)}
.chip.kid{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}

.addtoggle{font:inherit;font-size:12.5px;padding:4px 13px;margin:10px 0 0;cursor:pointer;
 border:1px dashed var(--line-strong);background:transparent;color:var(--ink-2);border-radius:999px}
.add{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0 0;
 background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.add[hidden]{display:none}   /* display:flex が hidden 属性に勝ってしまうため */
.add input,.add select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
 border:1px solid var(--line-strong);border-radius:3px;padding:6px 9px}
.add #addtitle{flex:1;min-width:180px}
.add .prim{font:inherit;font-size:13px;font-weight:700;padding:7px 16px;cursor:pointer;
 border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:3px}
.add .prim:disabled{opacity:.45;cursor:default}
.addnote{font-size:12.5px;color:var(--ink-3)}
/* まいにちのこと（定期タスク） */
.rec{margin:10px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rec[hidden]{display:none}
.recnote{margin:0 0 10px;font-size:12.5px;color:var(--ink-3)}
.recrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
.recrow:first-child{border-top:0}
.recrow .t{flex:1;min-width:150px;font-size:14px}
.recrow .who{font-size:12px;color:var(--ink-3)}
.recrow.off .t,.recrow.off .who,.recrow.off .wd{opacity:.45}
.wd{display:flex;gap:3px}
.wd button{font:inherit;font-size:11.5px;width:26px;height:26px;padding:0;cursor:pointer;
 border:1px solid var(--line-strong);border-radius:7px;background:var(--surface-2);color:var(--ink-3)}
.wd button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.recrow .del{font:inherit;font-size:13px;padding:3px 9px;cursor:pointer;background:none;
 border:1px solid var(--line);border-radius:7px;color:var(--ink-3)}
.recadd{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.recadd input,.recadd select,.recadd button{font:inherit;font-size:13.5px;color:var(--ink);
 background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px}
.recadd input{flex:1;min-width:160px}
.recadd button{cursor:pointer}
.recfoot{display:flex;gap:10px;align-items:center;margin:10px 0 0}
.recfoot .prim{font:inherit;font-size:13px;font-weight:700;padding:7px 16px;cursor:pointer;
 background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px}
.recfoot .prim:disabled{opacity:.45;cursor:default}
/* 年間予定のまとめ入れ */
.yp{margin:10px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.yp[hidden]{display:none}
.yp textarea{width:100%;min-height:130px;font:inherit;font-size:13px;line-height:1.6;color:var(--ink);
 background:var(--surface-2);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;resize:vertical}
.ypbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0 0}
.ypbar select,.ypbar button{font:inherit;font-size:13px;padding:7px 13px;cursor:pointer;
 background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:9px}
.ypbar .prim{font-weight:700;background:var(--accent);color:#fff;border-color:var(--accent)}
.ypbar .prim:disabled{opacity:.45;cursor:default}
.ypout{margin:10px 0 0;font-size:13px;line-height:1.75}
.ypout .ng{padding:9px 11px;border-radius:9px;background:var(--late);border:1px solid var(--late-line);color:var(--late-ink)}
.ypout .okbox{padding:9px 11px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--accent)}
.ypout ul{margin:7px 0 0;padding-left:1.2em}
.ypout .ex{font-size:12.5px;color:var(--ink-3)}
.ypout li{margin:3px 0}
.ypout .mv{font:inherit;font-size:12px;margin-left:6px;padding:2px 9px;cursor:pointer;
 background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:7px}
.ypout .mv:disabled{opacity:.5;cursor:default}
.ypfile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 9px}
.ypfile input[type=file]{font:inherit;font-size:12.5px;max-width:100%}
.ypfile button{font:inherit;font-size:13px;padding:7px 13px;cursor:pointer;background:var(--surface);
 color:var(--ink);border:1px solid var(--line-strong);border-radius:9px}
.ypfile button:disabled{opacity:.45;cursor:default}

h2{font-family:"Zen Old Mincho",serif;font-size:15px;margin:22px 0 8px;letter-spacing:.04em;
 display:flex;align-items:baseline;gap:9px}
h2 .cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);font-weight:400}
h2.late{color:var(--late-ink)}
h2.wait{color:var(--accent)}
.note{font-size:12.5px;color:var(--ink-3);margin:-4px 0 8px}
.acts button.ok{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}

.list{display:flex;flex-direction:column;gap:7px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);
 padding:10px 13px;display:flex;gap:11px;align-items:flex-start}
.row.is-late{background:var(--late);border-color:var(--late-line)}
.row.is-done{opacity:.5}
.chip{flex:none;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:2px;white-space:nowrap}
.k0{background:var(--kidA-soft);color:var(--kidA)}
.k1{background:var(--kidB-soft);color:var(--kidB)}
.main{flex:1;min-width:0}
.ttl{font-weight:700;font-size:14.5px;line-height:1.5}
.row.is-done .ttl{text-decoration:line-through}
.meta{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.kind{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;padding:1px 6px;
 border:1px solid var(--line-strong);border-radius:2px}
.doing{color:var(--accent);font-weight:700}
.bring{font-size:12px;color:var(--ink-2);margin-top:3px}
.bring b{color:var(--ink-3);font-weight:400}
.acts{flex:none;display:flex;gap:5px;align-items:center}
.acts button{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:3px;cursor:pointer;
 border:1px solid var(--line-strong);background:transparent;color:var(--ink-2)}
.acts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.acts button:disabled{opacity:.4;cursor:default}

.empty{border:1px dashed var(--line-strong);border-radius:4px;padding:26px 18px;text-align:center;
 color:var(--ink-3);font-size:13.5px}
.empty b{display:block;color:var(--accent);font-size:15px;margin-bottom:4px}
.err{background:#F7E7DF;border:1px solid #B94F2B;color:#963C1E;border-radius:4px;padding:12px 14px;font-size:13.5px;margin-top:18px}
:root[data-theme="dark"] .err{background:#33211A;color:#E8926B}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
 font-size:12px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* だれが つかう？（who.js） */
#who-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--bg,#fff);padding:24px}
#who-box{width:100%;max-width:420px;text-align:center}
#who-q{font-size:20px;font-weight:700;margin:0 0 20px}
#who-list{display:grid;gap:14px}
.who-pick{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;
  border:2px solid var(--who-color);border-radius:16px;background:transparent;
  color:inherit;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-align:left}
.who-pick:hover,.who-pick:focus-visible{background:color-mix(in srgb,var(--who-color) 12%,transparent)}
.who-face{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--who-color);color:#fff;font-size:24px}
@media (prefers-reduced-motion:no-preference){.who-pick{transition:background .15s}}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <h1>みまもりくん</h1>
    <span class="date" id="today"></span>
    <nav class="nav" aria-label="画面を切り替える">
      <a href="/">撮る</a>
      <a href="/board" class="on" aria-current="page">一覧</a>
      <a href="/schedule">予定表</a>
      <a href="/plan">計画</a>
      <a href="/kid">やりとり</a>
      <a href="/reward">ごほうび</a>
      <button class="theme" id="theme" type="button">☾ 暗く</button>
    </nav>
  </div>
</header>
<div id="demo"></div>

<div class="wrap">
  <div class="filters">
    <button data-f="all" aria-pressed="true">全員</button>
    <span id="kidbtns"></span>
    <button data-f="done" aria-pressed="false">済も表示</button>
    <span class="pts" id="pts"></span>
  </div>

  <div id="notice" hidden></div>

  <button class="addtoggle" id="addtoggle" type="button" aria-expanded="false">＋ 手で足す</button>
  <form class="add" id="add" hidden>
    <input type="text" id="addtitle" placeholder="件名（例：算数ドリル p.12）" required>
    <select id="addchild" aria-label="どの子"></select>
    <select id="addkind" aria-label="種別">
      <option value="deadline">提出</option>
      <option value="bring">持ち物</option>
      <option value="homework">宿題</option>
      <option value="event">行事</option>
    </select>
    <input type="date" id="adddate" aria-label="日付" required>
    <button type="submit" class="prim" id="addgo">入れる</button>
    <span class="addnote" id="addnote"></span>
  </form>

  <button class="addtoggle" id="rectoggle" type="button" aria-expanded="false">まいにちのこと</button>
  <div class="rec" id="rec" hidden>
    <p class="recnote">毎日きまっているものは、朝ひらいた時点で並びます。撮らなくても、打たなくてもいい。</p>
    <div id="reclist"></div>
    <div class="recadd">
      <input type="text" id="rectitle" placeholder="例：くもん 算数">
      <select id="recchild" aria-label="どの子"></select>
      <button type="button" id="recplus">足す</button>
    </div>
    <div class="recfoot">
      <button type="button" class="prim" id="recsave">保存する</button>
      <span class="addnote" id="recnote"></span>
    </div>
  </div>

  <button class="addtoggle" id="yptoggle" type="button" aria-expanded="false">年間予定をまとめて入れる</button>
  <div class="yp" id="yp" hidden>
    <p class="recnote"><strong>予定表そのもの（PDF・写真）から読み取るのがいちばん確かです。</strong>
      文字を貼ってもかまいませんが、アプリの「テキストで表示」は曜日がずれることがあります。
      どちらの場合も、入れる前に日付と曜日が合っているかをこちらで確かめます。</p>
    <div class="ypfile">
      <input type="file" id="ypfiles" accept="image/*,application/pdf" multiple aria-label="年間行事予定表のPDFか写真">
      <button type="button" id="ypread">写真・PDFから読み取る</button>
    </div>
    <textarea id="yptext" placeholder="4月&#10;8日 (水) 委員会、一斉下校訓練 13:45下校&#10;14日 (火) 保護者会&#10;…"></textarea>
    <div class="ypbar">
      <select id="ypchild" aria-label="どの子"></select>
      <select id="yplevel" aria-label="入れる範囲">
        <option value="family">家に関わるものだけ（保護者会・行事・下校時刻）</option>
        <option value="family,school">校内のこと（委員会・検診）も入れる</option>
      </select>
      <button type="button" id="ypcheck">確かめる</button>
      <button type="button" class="prim" id="ypgo" disabled>入れる</button>
    </div>
    <div class="ypout" id="ypout"></div>
  </div>

  <div id="body"></div>

  <footer>
    <a href="https://calendar.google.com/" target="_blank" rel="noopener">Google カレンダーで開く</a>
    <span id="meta"></span>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
const KIND={event:"行事",deadline:"提出",homework:"宿題",bring:"持ち物"};
let data=null, filter="all", showDone=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function fmt(iso){
  // 端末のタイムゾーンに引きずられないよう、文字列のまま扱う
  const [y,m,dd]=iso.split("-").map(Number);
  const w="日月火水木金土"[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  return m+"/"+dd+"（"+w+"）";
}

async function load(){
  try{
    const [t,c]=await Promise.all([
      fetch("/api/tasks").then(r=>r.json()),
      fetch("/api/config").then(r=>r.json()).catch(()=>({}))
    ]);
    if(t.detail) throw new Error(t.detail);
    data=t;
    $("#today").textContent=fmt(t.today);
    if(c.calendar_id) $("#meta").textContent="反映先: "+c.calendar_id;
    if(c.service_account==="(デモモード)"){
      $("#demo").innerHTML='<div class="demo">デモモードです。ダミーのタスクを表示しています（MIMAMORI_DEMO=1）</div>';
    }
    renderKidButtons();
    render();
  }catch(e){
    $("#body").innerHTML='<div class="err">'+esc(e.message||"読み込みに失敗しました")+"</div>";
  }
}

function renderKidButtons(){
  $("#kidbtns").innerHTML=data.children.map((n,i)=>
    '<button data-f="kid:'+esc(n)+'" aria-pressed="false">'+esc(n)+"</button>").join("");
  markFilter();
  const sel=$("#addchild"), keep=sel.value;
  sel.innerHTML=data.children.map(n=>"<option>"+esc(n)+"</option>").join("");
  if(keep) sel.value=keep;
  // 打ちかけの日付を、タブに戻った拍子に上書きしない。
  if(!$("#adddate").value) $("#adddate").value=data.today;
}

function markFilter(){
  document.querySelectorAll('.filters button:not([data-f="done"])').forEach(x=>
    x.setAttribute("aria-pressed",String(x.dataset.f===filter)));
  $('[data-f="done"]').setAttribute("aria-pressed",String(showDone));
}

// load() はタブに戻るたびに走る。そのたびにボタンへリスナーを貼ると
// 二重三重に付いて、1回のクリックで2回反転する＝押しても効かなくなる。
// 貼るのは親に一度だけ。
// 写真を撮るほどでもない1件を、その場で足す。抽出を通さないので承認も要らない。
$("#addtoggle").addEventListener("click",()=>{
  const open=$("#add").hidden;
  $("#add").hidden=!open;
  $("#addtoggle").setAttribute("aria-expanded",String(open));
  if(open) $("#addtitle").focus();
});

$("#add").addEventListener("submit",async e=>{
  e.preventDefault();
  const title=$("#addtitle").value.trim();
  const child=$("#addchild").value;
  if(!title) return;
  $("#addgo").disabled=true; $("#addnote").textContent="入れています…";
  try{
    const res=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({items:[{kind:$("#addkind").value,title:child+"｜"+title,
        child:child,date:$("#adddate").value}]})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"入れられませんでした");
    const r=(j.results||[])[0];
    if(!r||r.status!=="ok") throw new Error(r&&r.error||"入れられませんでした");
    $("#addtitle").value=""; $("#addnote").textContent="入れました";
    await load();
  }catch(err){
    $("#addnote").textContent=err.message;
  }
  $("#addgo").disabled=false;
});

$(".filters").addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b||!b.dataset.f) return;
  if(b.dataset.f==="done") showDone=!showDone;
  else filter=b.dataset.f;
  markFilter();
  render();
});

function group(items){
  const g={pending:[],late:[],today:[],tomorrow:[],week:[],later:[],plan:[],done:[]};
  for(const it of items){
    if(it.status==="rejected")continue;
    // 子が撮ったもの。親が通すまで、子のやることには出ていない。
    if(it.status==="pending"){g.pending.push(it);continue;}
    if(it.status==="done"){g.done.push(it);continue;}
    // 行事は行くだけで、チェックして消すものがない。
    // やることに混ぜると、提出物と同じ重みに見えてしまう。
    if(it.kind==="event"){g.plan.push(it);continue;}
    if(it.days_left<0)g.late.push(it);
    else if(it.days_left===0)g.today.push(it);
    else if(it.days_left===1)g.tomorrow.push(it);
    else if(it.days_left<=7)g.week.push(it);
    else g.later.push(it);
  }
  return g;
}

function render(){
  let items=data.items;
  if(filter.startsWith("kid:")) items=items.filter(i=>i.child===filter.slice(4));

  $("#pts").innerHTML=data.children.map(n=>
    '<span class="pt">'+esc(n)+' <b>'+(data.points[n]||0)+"</b>pt</span>").join("");

  const g=group(items);
  const secs=[
    ["late","遅れている",true],["today","今日",false],["tomorrow","明日",false],
    ["week","今週",false],["later","その先",false]
  ];
  let h="";
  if(g.pending.length){
    h+='<h2 class="wait">承認まち<span class="cnt">'+g.pending.length+"</span></h2>";
    h+='<div class="note">子どもが撮ったものです。通すまで、子のやることには出ません。</div>';
    h+='<div class="list">'+g.pending.map(rowHtml).join("")+"</div>";
  }
  const open=g.late.length+g.today.length+g.tomorrow.length+g.week.length+g.later.length;
  // 承認まちがあるのに「確認しなくて大丈夫」と出すと、やるべきことと食い違う。
  if(open===0&&!g.pending.length){
    h+='<div class="empty"><b>抜けはありません</b>確認しなくて大丈夫です。</div>';
  }
  for(const [k,label,late] of secs){
    if(!g[k].length) continue;
    h+='<h2'+(late?' class="late"':'')+'>'+label+'<span class="cnt">'+g[k].length+"</span></h2>";
    h+='<div class="list">'+g[k].map(rowHtml).join("")+"</div>";
  }
  if(g.plan.length){
    h+='<h2>予定<span class="cnt">'+g.plan.length+"</span></h2>";
    h+='<div class="list">'+g.plan.map(rowHtml).join("")+"</div>";
  }
  if(showDone&&g.done.length){
    h+='<h2>済<span class="cnt">'+g.done.length+"</span></h2>";
    h+='<div class="list">'+g.done.map(rowHtml).join("")+"</div>";
  }
  $("#body").innerHTML=h;
  document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",onStatus));
}

function rowHtml(it){
  const ki=data.children.indexOf(it.child);
  const late=it.days_left<0&&it.status!=="done";
  return '<div class="row'+(late?" is-late":"")+(it.status==="done"?" is-done":"")+'" data-id="'+esc(it.id)+'">'
    +'<span class="chip k'+(ki===0?0:1)+'">'+esc(it.child||"？")+"</span>"
    +'<div class="main">'
      +'<div class="ttl">'+esc(it.summary.replace(/^✓\s*/,"").replace(/^[^｜]*｜/,""))+"</div>"
      +'<div class="meta">'
        +"<span>"+fmt(it.date)+(it.time?" "+esc(it.time):"")+"</span>"
        +'<span class="kind">'+esc(KIND[it.kind]||it.kind||"—")+"</span>"
        +(late?'<span style="color:var(--late-ink);font-weight:700">'+Math.abs(it.days_left)+"日超過</span>":"")
        +(it.status==="doing"?'<span class="doing">やってる</span>':"")
        +(it.points?'<span>'+it.points+"pt</span>":"")
        +(it.source==="kid"?'<span class="chip kid">子が入れた</span>':"")
      +"</div>"
      +(it.bring?'<div class="bring"><b>持ち物:</b> '+esc(it.bring)+"</div>":"")
    +"</div>"
    // 「やってる」は子が /kid で言うこと。親は見るだけで、代わりに申告しない。
    +(it.status==="pending"?'<div class="acts">'
      +'<button class="ok" data-status="todo" data-id="'+esc(it.id)+'">通す</button>'
      +'<button data-status="rejected" data-id="'+esc(it.id)+'">けす</button>'
    +"</div>"
    :it.kind==="event"?"":'<div class="acts">'
      +'<button data-status="done" data-id="'+esc(it.id)+'" aria-pressed="'+(it.status==="done")+'">済</button>'
    +"</div>")
  +"</div>";
}

async function onStatus(e){
  const btn=e.currentTarget;
  const id=btn.dataset.id;
  const it=data.items.find(x=>x.id===id);
  if(!it) return;
  const next=(it.status===btn.dataset.status)?"todo":btn.dataset.status;
  btn.disabled=true;
  try{
    const res=await fetch("/api/status",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({event_id:id,status:next})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"更新に失敗しました");
    it.status=next;
    if(next==="done") data.points[it.child]=(data.points[it.child]||0)+it.points;
    else if(btn.dataset.status==="done") data.points[it.child]=Math.max(0,(data.points[it.child]||0)-it.points);
    render();
  }catch(err){
    btn.disabled=false;
    alert(err.message);
  }
}

// ---- まいにちのこと（定期タスク） ------------------------------------------
// 公文のプリントのように、内容が日替わりでないものはここで一度決める。
// 曜日を全部ONにしたら「毎日」。ONを外した曜日には出ない。
const WD=["月","火","水","木","金","土","日"];
let recs=null;

function recDays(t){ return t.days==="daily" ? [0,1,2,3,4,5,6] : (t.days||[]).map(Number); }

function renderRec(){
  const names=(data&&data.children)||[...new Set((recs||[]).map(t=>t.child))];
  const sel=$("#recchild");
  if(sel && !sel.options.length) sel.innerHTML=names.map(n=>'<option>'+esc(n)+'</option>').join("");
  $("#reclist").innerHTML=(recs||[]).map((t,i)=>{
    const on=recDays(t);
    return '<div class="recrow'+(t.enabled?"":" off")+'" data-i="'+i+'">'
      +'<input type="checkbox" class="en" aria-label="出す" '+(t.enabled?"checked":"")+'>'
      +'<span class="t">'+esc(t.title)+'</span>'
      +'<span class="who">'+esc(t.child)+'</span>'
      +'<span class="wd">'+WD.map((w,d)=>'<button type="button" data-d="'+d+'" aria-pressed="'
        +(on.includes(d))+'" aria-label="'+w+'曜">'+w+'</button>').join("")+'</span>'
      +'<button type="button" class="del" aria-label="やめる">やめる</button>'
      +'</div>';
  }).join("") || '<p class="recnote">まだありません。</p>';
}

async function loadRec(){
  try{
    const j=await fetch("/api/recurring").then(r=>r.json());
    recs=j.templates||[];
    renderRec();
  }catch(err){ $("#recnote").textContent="読めませんでした"; }
}

$("#rectoggle").addEventListener("click",()=>{
  const box=$("#rec"), open=box.hidden;
  box.hidden=!open;
  $("#rectoggle").setAttribute("aria-expanded",String(open));
  if(open && recs===null) loadRec();
});

$("#reclist").addEventListener("click",e=>{
  const row=e.target.closest(".recrow"); if(!row) return;
  const t=recs[+row.dataset.i]; if(!t) return;
  if(e.target.classList.contains("del")){ recs.splice(+row.dataset.i,1); renderRec(); return; }
  const d=e.target.dataset.d;
  if(d!==undefined){
    const on=new Set(recDays(t));
    on.has(+d)?on.delete(+d):on.add(+d);
    t.days=(on.size===7)?"daily":[...on].sort((a,b)=>a-b);
    if(on.size===0) t.enabled=false;   // 曜日が無い＝出さない、と同じこと
    renderRec();
  }
});

$("#reclist").addEventListener("change",e=>{
  const row=e.target.closest(".recrow"); if(!row||!e.target.classList.contains("en")) return;
  const t=recs[+row.dataset.i];
  t.enabled=e.target.checked;
  if(t.enabled && recDays(t).length===0) t.days="daily";
  renderRec();
});

$("#recplus").addEventListener("click",()=>{
  const title=$("#rectitle").value.trim();
  if(!title){ $("#rectitle").focus(); return; }
  recs.push({id:"r"+Date.now(),child:$("#recchild").value,title,kind:"homework",days:"daily",enabled:true});
  $("#rectitle").value="";
  renderRec();
});

$("#recsave").addEventListener("click",async()=>{
  const btn=$("#recsave"); btn.disabled=true; $("#recnote").textContent="";
  try{
    const res=await fetch("/api/recurring",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({templates:recs.filter(t=>recDays(t).length>0||!t.enabled)})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"保存できませんでした");
    recs=j.templates||recs;
    const made=(j.today&&j.today.created)||[];
    $("#recnote").textContent=made.length?("保存しました（今日のぶん "+made.length+"件）"):"保存しました";
    renderRec();
    load();
  }catch(err){ $("#recnote").textContent=err.message; }
  btn.disabled=false;
});

// ---- 年間予定のまとめ入れ --------------------------------------------------
// 144行の紙を、そのまま信じてカレンダーに流し込まない。
// 実物で、曜日が全行ずれている資料に当たった。確かめてから入れる。
let ypOk=false;

function ypBody(confirm){
  return JSON.stringify({
    text:$("#yptext").value,
    child:$("#ypchild").value,
    levels:$("#yplevel").value.split(","),
    confirm:!!confirm
  });
}

function ypChildren(){
  const sel=$("#ypchild");
  if(sel.options.length) return;
  const names=(data&&data.children)||[];
  sel.innerHTML=names.map(n=>'<option>'+esc(n)+'</option>').join("");
  if(names.length>1) sel.selectedIndex=names.length-1;   // 小学校のほうが行事が多い
}

$("#yptoggle").addEventListener("click",()=>{
  const box=$("#yp"), open=box.hidden;
  box.hidden=!open;
  $("#yptoggle").setAttribute("aria-expanded",String(open));
  if(open) ypChildren();
});

// 表そのものから読む。アプリのテキスト書き出しは曜日の列がずれることが分かっている。
// 読んだ結果はそのまま下の枠に出す。**人が見て直せる形で渡してから**、計算で確かめる。
$("#ypread").addEventListener("click",async()=>{
  const files=$("#ypfiles").files;
  if(!files||!files.length){ $("#ypfiles").click(); return; }
  const btn=$("#ypread"); btn.disabled=true; $("#ypout").textContent="読み取っています…（表は少し時間がかかります）";
  try{
    const fd=new FormData();
    for(const f of files) fd.append("files",f);
    const res=await fetch("/api/year_plan/extract",{method:"POST",body:fd});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"読み取れませんでした");
    $("#yptext").value=j.text;
    $("#ypout").innerHTML='<p class="ex">'+j.pages+'ページ読みました。下の枠が読み取った中身です。おかしいところは直せます。</p>';
    $("#ypcheck").click();
  }catch(err){ $("#ypout").innerHTML='<div class="ng">'+esc(err.message)+'</div>'; }
  btn.disabled=false;
});

$("#ypcheck").addEventListener("click",async()=>{
  const btn=$("#ypcheck"); btn.disabled=true; $("#ypout").textContent="確かめています…";
  try{
    const res=await fetch("/api/year_plan/check",{method:"POST",headers:{"Content-Type":"application/json"},body:ypBody()});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"確かめられませんでした");
    ypOk=j.check.ok;
    $("#ypgo").disabled=false;
    $("#ypgo").textContent=ypOk?"入れる":"それでも入れる";
    let h='<div class="'+(ypOk?"okbox":"ng")+'">'
      +'<strong>'+(ypOk?"確かめました。":"この資料は、そのままでは入れられません。")+'</strong>'
      +'<ul>'+j.check.notes.map(n=>"<li>"+esc(n).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")+"</li>").join("")+'</ul></div>';
    if(j.check.examples.length){
      h+='<p class="ex">例: '+j.check.examples.map(e=>esc(e.date)+" は資料が「"+esc(e.label)+"」、実際は「"+esc(e.real)+"」（"+esc(e.title)+"）").join(" ／ ")+'</p>';
    }
    h+='<p>読めた行 '+j.check.dated+'件 ／ 入れる候補 <strong>'+j.will_add+'件</strong>'
      +'（家に関わる '+j.counts.family+' ・ 校内 '+j.counts.school+' ・ 休み '+j.counts.holiday+'）</p>';
    if(j.preview.length){
      h+='<p class="ex">はじめの数件: '+j.preview.slice(0,5).map(p=>esc(p.date)+" "+esc(p.title)).join(" ／ ")+'</p>';
    }
    $("#ypout").innerHTML=h;
  }catch(err){ $("#ypout").innerHTML='<div class="ng">'+esc(err.message)+'</div>'; }
  btn.disabled=false;
});

// 改訂版で日にちが変わったものを、1件ずつ直す。まとめて直さないのは、
// 改訂版の読み取りのほうが間違っていることがあるから。押した人が見て決める。
$("#ypout").addEventListener("click",async e=>{
  const btn=e.target.closest(".mv"); if(!btn) return;
  btn.disabled=true; btn.textContent="直しています…";
  try{
    const res=await fetch("/api/year_plan/move",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({event_id:btn.dataset.id,date:btn.dataset.date})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"直せませんでした");
    btn.replaceWith(document.createTextNode("直しました"));
    load();
  }catch(err){ btn.disabled=false; btn.textContent="この日に直す"; alert(err.message); }
});

$("#ypgo").addEventListener("click",async()=>{
  if(!ypOk && !window.confirm("日付が確かめられていません。入れたあとに直すのは大変です。それでも入れますか？")) return;
  const btn=$("#ypgo"); btn.disabled=true;
  try{
    const res=await fetch("/api/year_plan/register",{method:"POST",headers:{"Content-Type":"application/json"},body:ypBody(true)});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"入れられませんでした");
    let h='<div class="okbox"><strong>'+j.created+'件 入れました。</strong>';
    if(j.skipped) h+=' すでにあった '+j.skipped+'件は作りませんでした。';
    h+='</div>';
    if(j.moved&&j.moved.length){
      h+='<p><strong>日にちが変わったかもしれないもの:</strong> 1件ずつ見て、直すものだけ押してください。</p><ul id="ypmoved">'
        +j.moved.slice(0,20).map(m=>'<li>'+esc(m.title)+"："+esc(m.before)+" → "+esc(m.after)
          +(m.event_id?' <button type="button" class="mv" data-id="'+esc(m.event_id)+'" data-date="'+esc(m.after)+'">この日に直す</button>':"")
          +'</li>').join("")+"</ul>";
    }
    $("#ypout").innerHTML=h;
    load();
  }catch(err){ $("#ypout").innerHTML='<div class="ng">'+esc(err.message)+'</div>'; }
  btn.disabled=false;
});

// ---- 子が入れたものの知らせ ------------------------------------------------
// 承認は挟まない（D-62）。挟むと、通し忘れた日は子のやることが空のまま終わる。
// 代わりに、入ったことをここで知らせる。違っていたらその場で消せる。
async function loadNotices(){
  let list=[];
  try{ list=(await fetch("/api/notices?unseen=true").then(r=>r.json())).items||[]; }
  catch(e){ return; }
  const box=$("#notice");
  if(!list.length){ box.hidden=true; box.innerHTML=""; return; }
  const n=list[0];                      // いちばん新しいものだけ出す。溜めて見せない
  box.hidden=false;
  box.innerHTML='<div class="hd"><b>'+esc(n.title)+"</b>"
    +'<span class="when">'+esc((n.at||"").slice(5,16).replace("T"," "))+"</span>"
    +'<button type="button" class="seen" data-n="'+esc(n.id)+'">見た</button></div>'
    +"<ul>"+(n.items||[]).map(i=>"<li><span>"+esc(String(i.title).replace(/^[^｜]*｜/,""))+"</span>"
        +'<button type="button" class="del" data-id="'+esc(i.id)+'">ちがう（消す）</button></li>').join("")+"</ul>"
    +(list.length>1?'<div class="when">ほかに '+(list.length-1)+"件の知らせがあります</div>":"");
}

$("#notice").addEventListener("click",async e=>{
  const seen=e.target.closest(".seen"), del=e.target.closest(".del");
  if(seen){
    seen.disabled=true;
    try{ await fetch("/api/notices/seen",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:seen.dataset.n})}); }catch(err){}
    loadNotices();
    return;
  }
  if(del){
    del.disabled=true; del.textContent="消しています…";
    try{
      const r=await fetch("/api/status",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({event_id:del.dataset.id,status:"rejected"})});
      if(!r.ok) throw new Error("ng");
      del.closest("li").remove();
      load();
    }catch(err){ del.disabled=false; del.textContent="ちがう（消す）"; alert("消せませんでした"); }
  }
});

load();
loadNotices();

// 子が /kid で終わらせたものを、こちらに戻ってきた時点で反映する。
// 手でリロードしないと消えないと、消えたことに気づけない。
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){ load(); loadNotices(); }
});
</script>
</body>
</html>
