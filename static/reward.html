<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みまもりくん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="/static/theme.js"></script>
<script src="/static/who.js" defer></script>
<style>
:root{
  --paper:#FAF7F0;--surface:#fff;--ink:#1F2422;--ink-2:#5A625F;
  --line:#E4E0D5;--line-strong:#CFC9B9;--me:#0F6B62;--me-ink:#fff;
  --warm:#C8961E;--warm-soft:#FBF3DF;--error:#B42318;
  --shadow:0 1px 2px rgba(31,36,34,.05),0 10px 26px -20px rgba(31,36,34,.45);
}
:root[data-theme="dark"]{
  --paper:#14110C;--surface:#1E1B15;--ink:#F0ECE2;--ink-2:#B5AE9E;
  --line:#312C22;--line-strong:#453E30;--me:#5FCFC0;--me-ink:#14110C;
  --warm:#E0BB63;--warm-soft:#2C2413;--error:#FF9A91;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -20px rgba(0,0,0,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
header,footer{border-bottom:1px solid var(--line)}
.hdr,main,footer{max-width:640px;margin:0 auto;padding:16px}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:"Zen Maru Gothic",sans-serif;font-size:19px;margin:0;letter-spacing:.04em}
select{max-width:100%;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px}
.pt{margin-left:auto;color:var(--warm);background:var(--warm-soft);border-radius:999px;padding:4px 13px;white-space:nowrap}
section{margin-bottom:28px}
h2{font-size:17px;margin:0 0 12px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow-wrap:anywhere}
.card h3{margin:0 0 8px;font-size:16px;font-weight:500}
.card.unavailable{opacity:.6}
.badge{display:inline-block;margin-left:10px;padding:2px 8px;border-radius:999px;background:var(--me);color:var(--me-ink);font-size:12px}
.card .ask{margin:10px 0 0;font:inherit;font-size:14px;font-weight:700;padding:8px 16px;cursor:pointer;
 background:var(--me);color:var(--me-ink);border:1px solid var(--me);border-radius:10px}
.card .ask:disabled{opacity:.45;cursor:default}
.card .pace{display:block;margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
/* もうしこみの状況 */
.reqs{list-style:none;padding:0;margin:0}
.reqs li{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line)}
.reqs li:first-child{border-top:0}
.reqs .st{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.reqs .st.requested{background:var(--warm-soft);color:var(--warm);border-color:var(--warm)}
.reqs .st.approved{background:var(--me);color:var(--me-ink);border-color:var(--me)}
.reqs .st.handed{opacity:.6}
.reqs .st.rejected{color:var(--error);border-color:var(--error)}
.reqs .lb{flex:1;min-width:140px}
.reqs .note{width:100%;font-size:12.5px;color:var(--ink-2)}
.reqs button{font:inherit;font-size:12.5px;padding:4px 11px;cursor:pointer;border-radius:9px;
 border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.parent{margin-top:10px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:14px}
.parent[hidden]{display:none}
.parent .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 9px}
.parent input{font:inherit;font-size:14px;padding:7px 10px;width:110px;border:1px solid var(--line-strong);
 border-radius:9px;background:var(--surface);color:var(--ink)}
.parent .lab{font-size:12.5px;color:var(--ink-2)}
.toggle{font:inherit;font-size:13px;padding:5px 13px;cursor:pointer;border:1px solid var(--line-strong);
 border-radius:999px;background:var(--surface);color:var(--ink-2)}
.history{list-style:none;padding:0;margin:0}
.history li{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.date{color:var(--ink-2);font-size:14px;white-space:nowrap}
.title{flex:1;overflow-wrap:anywhere;min-width:0}
.points{white-space:nowrap}
table{font-size:14px;border-collapse:collapse;width:100%}
th,td{padding:6px 0;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500}td{text-align:right}
.note,footer{font-size:13px;color:var(--ink-2)}
footer{border-top:1px solid var(--line);border-bottom:0}
footer p{margin:8px 0}
.nav{flex-basis:100%;display:flex;gap:6px;overflow-x:auto}
.nav a{flex:none;font-size:12.5px;text-decoration:none;padding:4px 12px;white-space:nowrap;
 border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-2)}
.nav a.on{background:var(--me);border-color:var(--me);color:var(--paper);font-weight:700}
.theme{margin-left:auto;flex:none;font:inherit;font-size:12.5px;padding:4px 12px;white-space:nowrap;
 border:1px solid var(--line-strong);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer}
a{color:var(--me)}
:focus-visible{outline:2px solid var(--me);outline-offset:3px}
#error{color:var(--error)}
#status{color:var(--ink-2);font-size:14px}

/* だれが つかう？（who.js） */
#who-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--bg,#fff);padding:24px}
#who-box{width:100%;max-width:420px;text-align:center}
#who-q{font-size:20px;font-weight:700;margin:0 0 20px}
#who-list{display:grid;gap:14px}
.who-pick{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;
  border:2px solid var(--who-color);border-radius:16px;background:transparent;
  color:inherit;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-align:left}
.who-pick:hover,.who-pick:focus-visible{background:color-mix(in srgb,var(--who-color) 12%,transparent)}
.who-face{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--who-color);color:#fff;font-size:24px}
@media (prefers-reduced-motion:no-preference){.who-pick{transition:background .15s}}
</style>
</head>
<body>
<header><div class="hdr">
  <h1>みまもりくん</h1>
  <select id="child" aria-label="子ども" disabled></select>
  <span class="pt"><b id="balance">—</b> pt</span>
  <nav class="nav" aria-label="画面を切り替える">
    <a href="/">撮る</a>
    <a href="/board">一覧</a>
      <a href="/schedule">予定表</a>
      <a href="/plan">計画</a>
    <a href="/kid">やりとり</a>
    <a href="/reward" class="on" aria-current="page">ごほうび</a>
    <button class="theme" id="theme" type="button">☾ 暗く</button>
  </nav>
</div></header>
<main>
  <p id="status" role="status"></p>
  <p id="error" role="alert" hidden></p>
  <section aria-labelledby="rewards-heading">
    <h2 id="rewards-heading">交換できるもの</h2>
    <div id="rewards" class="cards"></div>
  </section>
  <section aria-label="もうしこみ">
    <h2>もうしこみ</h2>
    <ul id="reqs" class="reqs"></ul>
    <button type="button" class="toggle" id="ptoggle" aria-expanded="false">おうちの人がきめる</button>
    <div class="parent" id="parent" hidden>
      <div class="row">
        <span class="lab">1か月に使えるお金</span>
        <input type="number" id="capyen" min="0" step="100"><span class="lab">円（0＝きめない）</span>
      </div>
      <div class="row">
        <span class="lab">1か月の回数</span>
        <input type="number" id="capcount" min="0" step="1"><span class="lab">回（0＝きめない）</span>
        <span class="lab" id="capnote"></span>
      </div>
      <p class="lab" id="left"></p>
    </div>
  </section>

  <section aria-labelledby="history-heading">
    <h2 id="history-heading">たまった記録</h2>
    <ul id="history" class="history"></ul>
  </section>
  <section aria-labelledby="rules-heading">
    <h2 id="rules-heading">ポイントのきまり</h2>
    <table aria-labelledby="rules-heading"><tbody id="rules"></tbody></table>
    <p class="note">テストは点数ではなく、直した問題の数につきます</p>
  </section>
</main>
<footer>
  <p>交換はおうちの人と相談して決めます</p>
</footer>
<script>
const $=s=>document.querySelector(s);
let requestId=0;
function element(tag,text,className){
  const node=document.createElement(tag);
  if(text!==undefined) node.textContent=text;
  if(className) node.className=className;
  return node;
}
async function get(url){
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok) throw new Error("読み込み失敗");
  return response.json();
}
function render(data,rewards){
  $("#balance").textContent=data.balance;
  for(const reward of rewards){
    const available=data.balance>=reward.points;
    const card=element("article",undefined,"card"+(available?"":" unavailable"));
    card.appendChild(element("h3",reward.label));
    card.appendChild(element("span",reward.points+" pt","points"));
    if(available) card.appendChild(element("span","交換できる","badge"));
    // 申し込むのは子。買って渡すのは人（D-44）。アプリはお金に触らない。
    const ask=element("button","もうしこむ","ask");
    ask.type="button";
    ask.disabled=!available;
    ask.addEventListener("click",()=>askFor(reward));
    card.appendChild(ask);
    if(!available){
      // 「あと◯pt」ではなく「今のペースだと約◯日」。数えさせるより、見通しを出す。
      const pace=element("span","","pace");
      pace.dataset.cost=reward.points;
      card.appendChild(pace);
    }
    $("#rewards").appendChild(card);
  }
  if(!rewards.length) $("#rewards").appendChild(element("p","交換できるものはまだありません"));
  const history=[...data.history].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  for(const entry of history){
    const row=element("li");
    const parts=String(entry.date).match(/^\d{4}-(\d{2})-(\d{2})/);
    row.appendChild(element("span",parts?Number(parts[1])+"/"+Number(parts[2]):entry.date,"date"));
    row.appendChild(element("span",entry.title,"title"));
    row.appendChild(element("span","+"+entry.points+" pt","points"));
    $("#history").appendChild(row);
  }
  if(!history.length) $("#history").appendChild(element("li","まだ記録はありません"));
  for(const [key,label] of Object.entries({homework:"宿題",deadline:"提出物",bring:"持ち物",event:"行事"})){
    const row=element("tr");
    const heading=element("th",label);
    heading.scope="row";
    row.appendChild(heading);
    row.appendChild(element("td",data.rules[key]+" pt"));
    $("#rules").appendChild(row);
  }
}
// ---- もうしこみ ------------------------------------------------------------
const ST={requested:"もうしこみ",approved:"OK",handed:"わたした",rejected:"なし"};

async function askFor(reward){
  const child=$("#child").value;
  const yen=Number(reward.yen||0);
  try{
    const res=await fetch("/api/redeem",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({child:child,label:reward.label,cost:reward.points,yen:yen})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"もうしこめませんでした");
    refresh();
  }catch(err){
    $("#error").textContent=err.message; $("#error").hidden=false;
  }
}

async function loadRequests(){
  const child=$("#child").value;
  let j=null;
  try{ j=await get("/api/redeem?child="+encodeURIComponent(child)); }catch(e){ return; }
  const parentOpen=$("#parent").getAttribute("data-open")==="1";
  $("#reqs").replaceChildren();
  if(!j.items.length){
    $("#reqs").appendChild(element("li","まだありません"));
  }
  for(const r of j.items.slice(0,8)){
    const li=element("li");
    li.appendChild(element("span",ST[r.status]||r.status,"st "+r.status));
    li.appendChild(element("span",r.label+"（"+r.cost+"pt）","lb"));
    if(parentOpen && (r.status==="requested"||r.status==="approved")){
      if(r.status==="requested"){
        const ok=element("button","OK"); ok.type="button";
        ok.addEventListener("click",()=>decide("approve",r.id));
        li.appendChild(ok);
      }
      const hand=element("button","わたした"); hand.type="button";
      hand.addEventListener("click",()=>decide("hand",r.id));
      li.appendChild(hand);
      const no=element("button","ちがう"); no.type="button";
      no.addEventListener("click",()=>{
        const note=window.prompt("理由を書いてください（子どもに伝わります）");
        if(note && note.trim()) decide("reject",r.id,note.trim());
      });
      li.appendChild(no);
    }
    if(r.note) li.appendChild(element("span","・"+r.note,"note"));
    $("#reqs").appendChild(li);
  }
  const rem=j.remaining||{};
  const bits=[];
  if(rem.yen_left!=null) bits.push("今月あと "+rem.yen_left+"円");
  if(rem.count_left!=null) bits.push("あと "+rem.count_left+"回");
  $("#left").textContent=bits.join("／");
  if(rem.cap){ $("#capyen").value=rem.cap.yen; $("#capcount").value=rem.cap.count; }
}

async function decide(what,id,note){
  try{
    const res=await fetch("/api/redeem/"+what,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:id,note:note||""})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"できませんでした");
    refresh();
  }catch(err){ $("#error").textContent=err.message; $("#error").hidden=false; }
}

async function loadPace(){
  const child=$("#child").value;
  for(const el of document.querySelectorAll(".pace")){
    const cost=el.dataset.cost;
    try{
      const j=await get("/api/redeem/pace?child="+encodeURIComponent(child)+"&cost="+cost);
      el.textContent = j.days==null ? "" : (j.days===0 ? "" : "今のペースだと 約"+j.days+"日");
    }catch(e){}
  }
}

$("#ptoggle").addEventListener("click",()=>{
  const box=$("#parent"), open=box.hidden;
  box.hidden=!open;
  box.setAttribute("data-open", open?"1":"0");
  $("#ptoggle").setAttribute("aria-expanded",String(open));
  loadRequests();
});

async function saveCap(){
  try{
    const res=await fetch("/api/redeem/cap",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({yen:Number($("#capyen").value||0),count:Number($("#capcount").value||0)})});
    if(!res.ok) throw new Error("きめられませんでした");
    $("#capnote").textContent="きめました";
    loadRequests();
  }catch(err){ $("#capnote").textContent=err.message; }
}
$("#capyen").addEventListener("change",saveCap);
$("#capcount").addEventListener("change",saveCap);

async function refresh(){
  const id=++requestId;
  const selected=$("#child").value;
  $("#error").hidden=true;
  $("#status").textContent="読み込み中";
  $("#balance").textContent="—";
  for(const target of ["#rewards","#history","#rules"]) $(target).replaceChildren();
  try{
    const [config,data,rewards]=await Promise.all([
      get("/api/config"),
      get("/api/points?child="+encodeURIComponent(selected)),
      get("/api/rewards")
    ]);
    if(id!==requestId) return;
    setChildren(config.children,selected);
    if($("#child").value!==selected) return refresh();
    render(data,rewards.rewards);
    loadRequests();
    loadPace();
  }catch(error){
    if(id!==requestId) return;
    $("#error").textContent="読み込めませんでした。もう一度画面を開いてください。";
    $("#error").hidden=false;
  }finally{
    if(id===requestId) $("#status").textContent="";
  }
}
function setChildren(children,selected){
  if(!children.length) throw new Error("子ども未登録");
  $("#child").replaceChildren();
  for(const child of children){
    const option=element("option",child.name);
    option.value=child.name;
    $("#child").appendChild(option);
  }
  if(children.some(child=>child.name===selected)) $("#child").value=selected;
  $("#child").disabled=false;
}
async function boot(){
  $("#status").textContent="読み込み中";
  try{
    const config=await get("/api/config");
    setChildren(config.children,"");
    await refresh();
  }catch(error){
    $("#status").textContent="";
    $("#error").textContent="読み込めませんでした。もう一度画面を開いてください。";
    $("#error").hidden=false;
  }
}
$("#child").addEventListener("change",refresh);
boot();
</script>
</body>
</html>
