<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みまもりくん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="/static/theme.js"></script>
<script src="/static/who.js" defer></script>
<style>
:root{
  --paper:#FAF7F0;--surface:#fff;--ink:#1F2422;--ink-2:#5A625F;--ink-3:#8B938F;
  --line:#E4E0D5;--line-strong:#CFC9B9;
  --me:#0F6B62;--me-ink:#fff;
  --bot:#fff;--bot-line:#D9CFAE;--bot-name:#9A7B23;
  --warm:#C8961E;--warm-soft:#FBF3DF;
  --shadow:0 1px 2px rgba(31,36,34,.05),0 10px 26px -20px rgba(31,36,34,.45);
}
:root[data-theme="dark"]{
  --paper:#14110C;--surface:#1E1B15;--ink:#F0ECE2;--ink-2:#B5AE9E;--ink-3:#867F70;
  --line:#312C22;--line-strong:#453E30;
  --me:#5FCFC0;--me-ink:#14110C;
  --bot:#221E17;--bot-line:#4A4030;--bot-name:#D9BE7A;
  --warm:#E0BB63;--warm-soft:#2C2413;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -20px rgba(0,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
 font-size:16px;line-height:1.75;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

header{border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.hdr{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{flex-basis:100%;display:flex;gap:6px;overflow-x:auto}
.nav a{flex:none;font-size:12.5px;text-decoration:none;padding:4px 12px;white-space:nowrap;
 border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-2)}
.nav a.on{background:var(--me);border-color:var(--me);color:var(--paper);font-weight:700}
.theme{margin-left:auto;flex:none;font:inherit;font-size:12.5px;padding:4px 12px;white-space:nowrap;
 border:1px solid var(--line-strong);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer}
h1{font-family:"Zen Maru Gothic",sans-serif;font-size:19px;margin:0;letter-spacing:.04em}
.who{font-size:13px;color:var(--ink-2)}
.tts{font:inherit;font-size:11px;color:var(--ink-2);background:transparent;border:1px solid var(--line-strong);border-radius:999px;padding:3px 6px;cursor:pointer}
.who select{font:inherit;font-size:13px;background:transparent;color:var(--ink);
 border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px}
.pt{text-decoration:none;margin-left:auto;font-family:"Zen Maru Gothic",sans-serif;font-size:14px;color:var(--warm);
 background:var(--warm-soft);border-radius:999px;padding:4px 13px;font-weight:700}

main{flex:1;overflow-y:auto}
.thread{max-width:640px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:84%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--bot);border:1px solid var(--bot-line);align-self:flex-start;border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.msg.bot .nm{display:block;font-family:"Zen Maru Gothic",sans-serif;font-size:11.5px;color:var(--bot-name);
 letter-spacing:.08em;margin-bottom:3px}
.msg.me{background:var(--me);color:var(--me-ink);align-self:flex-end;border-bottom-right-radius:5px;font-weight:500}
.msg.shot{padding:6px;background:var(--surface);border:1px solid var(--line)}
.msg.shot img{display:block;max-width:200px;border-radius:11px}
.msg.sys{align-self:center;background:transparent;font-size:12.5px;color:var(--ink-3);text-align:center;max-width:100%}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:3px;
 animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

footer{flex:none;border-top:1px solid var(--line);background:var(--paper)}
.bar{max-width:640px;margin:0 auto;padding:10px 16px 16px;display:flex;gap:8px;align-items:flex-end}
.icon{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);
 background:var(--surface);color:var(--ink-2);font-size:20px;cursor:pointer;display:grid;place-items:center}
.icon:active{transform:scale(.95)}
.icon.rec{background:var(--me);border-color:var(--me);color:var(--me-ink);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,107,98,.4)}50%{box-shadow:0 0 0 9px rgba(15,107,98,0)}}
textarea{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
 border:1px solid var(--line-strong);border-radius:23px;padding:11px 16px;resize:none;max-height:130px;line-height:1.6}
textarea:focus{outline:2px solid var(--me);outline-offset:1px}
textarea.interim{color:var(--ink-3)}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--me);color:var(--me-ink);
 font-size:18px;cursor:pointer}
.send:disabled{opacity:.35;cursor:default}
.wait{margin-left:6px;font-size:13px;color:var(--ink-2)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hint{max-width:640px;margin:0 auto;padding:0 16px 10px;font-size:11.5px;color:var(--ink-3);text-align:center}
h1,.tts,.pt,.who select{white-space:nowrap}
@media (max-width:420px){
  .hdr{padding:10px 12px;gap:6px}
  h1{font-size:16px;letter-spacing:.02em}
  .who select{font-size:12px;padding:3px 6px}
  .tts{font-size:10px;padding:3px 5px}
  .pt{font-size:13px;padding:3px 9px}
}

/* 上の子モード：枠バーと「明日に送る」 */
#frame{margin:10px 14px 0;padding:10px 12px;border:1px solid var(--line,#dcded6);border-radius:14px;
 background:var(--surface,#fff)}
#frame[hidden]{display:none}
#frame .top{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-3,#7c8783)}
#frame .tot{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink,#191c1b);font-weight:700}
#frame .bar{display:flex;align-items:stretch;gap:3px;height:14px;margin:8px 0 0;border-radius:8px;overflow:hidden;
 background:var(--surface-2,#fbfbf7);border:1px solid var(--line,#dcded6)}
#frame .seg{align-self:stretch;min-height:12px;background:var(--kidA,#2f6690);opacity:.85}
#frame .seg:nth-child(even){opacity:.6}
#frame .over{background:var(--late-line,#b94f2b)}
#frame .msg{margin:7px 0 0;font-size:12.5px;color:var(--late-ink,#963c1e)}
.card .min{margin-left:auto;font-size:12px;color:var(--ink-3,#7c8783);font-variant-numeric:tabular-nums}
.card .later,.cardwrap .later{font:inherit;font-size:11.5px;padding:4px 9px;border-radius:8px;
 border:1px solid var(--line-strong,#c3c8bf);background:var(--surface-2,#fbfbf7);color:var(--ink-2,#4a524f)}

/* 電波がないとき */
#offline{margin:10px 14px 0;padding:7px 12px;border:1px dashed var(--line-strong,#c3c8bf);border-radius:12px;
 font-size:12.5px;color:var(--ink-3,#7c8783);background:var(--surface-2,#fbfbf7)}
#offline[hidden]{display:none}

/* 週の台紙（★5つ・日曜に戻る） */
#board{margin:10px 14px 0;padding:10px 12px;border:1px solid var(--line,#dcded6);border-radius:14px;
 background:var(--surface,#fff);display:flex;align-items:center;gap:10px}
#board[hidden]{display:none}
#board .lbl{font-size:12.5px;color:var(--ink-3,#7c8783);flex:none}
#board .slots{display:flex;gap:6px;font-size:22px;line-height:1}
#board .s{filter:grayscale(1);opacity:.28}
#board .s.on{filter:none;opacity:1}
@media (prefers-reduced-motion:no-preference){
  #board .s{transition:opacity .25s,filter .25s,transform .25s}
  #board .s.pop{transform:scale(1.35)}
}
#board .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3,#7c8783);font-variant-numeric:tabular-nums}
#board.full{border-color:var(--accent,#0f6b62);background:var(--accent-soft,#e2f0ed)}

/* 紙吹雪 */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;display:block}
@media (prefers-reduced-motion:no-preference){
  #confetti i{animation:fall 1.9s linear forwards}
  @keyframes fall{
    0%{transform:translateY(-10px) rotate(0deg);opacity:1}
    100%{transform:translateY(105vh) rotate(540deg);opacity:.9}
  }
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* だれが つかう？（who.js） */
#who-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--bg,#fff);padding:24px}
#who-box{width:100%;max-width:420px;text-align:center}
#who-q{font-size:20px;font-weight:700;margin:0 0 20px}
#who-list{display:grid;gap:14px}
.who-pick{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;
  border:2px solid var(--who-color);border-radius:16px;background:transparent;
  color:inherit;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-align:left}
.who-pick:hover,.who-pick:focus-visible{background:color-mix(in srgb,var(--who-color) 12%,transparent)}
.who-face{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--who-color);color:#fff;font-size:24px}
@media (prefers-reduced-motion:no-preference){.who-pick{transition:background .15s}}

/* きょうのやること（カード）
   読み書きゼロで終われるように、タップだけで完了にする。
   数は出さない。相棒が「残りを数えない」ので、画面も数えない。 */
#today{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 6px;scrollbar-width:thin}
#today:empty{display:none}
.card{flex:none;width:104px;min-height:104px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:12px 8px;
  border:2px solid var(--line,#d3d8dd);border-radius:16px;background:transparent;
  color:inherit;font:inherit;cursor:pointer;text-align:center;line-height:1.35}
.card .ic{font-size:30px;line-height:1}
.card .tx{font-size:13px;font-weight:700;word-break:break-word}
.card.late{border-color:#C2614A}
.card:hover,.card:focus-visible{background:rgba(127,127,127,.10)}
.card.done{opacity:0;transform:scale(.86)}
@media (prefers-reduced-motion:no-preference){
  .card{transition:opacity .25s,transform .25s,background .15s}
}
.cardwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.cardwrap .card{width:104px}
.card-none{padding:14px 6px;font-size:14px;opacity:.75}
</style>
</head>
<body>
<header><div class="hdr">
  <h1>みまもりくん</h1>
  <span class="who"><select id="child"></select></span>
  <button class="tts" id="tts" aria-pressed="true">読み上げ オン</button>
  <a class="pt" id="pt" href="/reward" title="ポイントと交換">— pt</a>
  <nav class="nav" aria-label="画面を切り替える">
    <a href="/">撮る</a>
    <a href="/board">一覧</a>
      <a href="/schedule">予定表</a>
      <a href="/plan">計画</a>
    <a href="/kid" class="on" aria-current="page">やりとり</a>
    <a href="/reward">ごほうび</a>
    <button class="theme" id="theme" type="button">☾ 暗く</button>
  </nav>
</div></header>

<main id="main">
  <section id="today" aria-label="きょうのやること"></section>
  <section id="frame" aria-label="きょうの枠" hidden></section>
  <p id="offline" role="status" hidden></p>
  <section id="board" aria-label="こんしゅうの だいし" hidden></section>
  <div class="thread" id="thread"></div>
</main>

<footer>
  <div class="bar">
    <label class="icon" for="cam" title="おたよりを撮る">📷
      <input type="file" id="cam" accept="image/*" capture="environment">
    </label>
    <button class="icon" id="mic" title="声で話す" aria-pressed="false">🎤</button>
    <textarea id="msg" rows="1" placeholder="ここに書く"></textarea>
    <button class="send" id="send" disabled>↑</button>
  </div>
  <div class="hint">やりとりはおうちの人も見られます</div>
</footer>

<script>
const $=s=>document.querySelector(s);
const thread=$("#thread");
let child="", history=[], busy=false;
let stopRecognition=()=>{};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function scroll(){$("#main").scrollTop=$("#main").scrollHeight;}

function add(kind,text,html){
  const d=document.createElement("div");
  d.className="msg "+kind;
  if(kind==="bot") d.innerHTML='<span class="nm">みまもりくん</span>'+(html||esc(text));
  else d.innerHTML=html||esc(text);
  thread.appendChild(d); scroll(); return d;
}
function thinking(){
  const d=add("bot","",'<span class="dots"><span></span><span></span><span></span></span><span class="wait"></span>');
  const wait=d.querySelector(".wait"), started=Date.now();
  const timer=setInterval(()=>{
    const seconds=(Date.now()-started)/1000;
    wait.textContent=seconds>=10?"もうすこし":seconds>=3?"やることを見てる":"";
  },250);
  d.clear=()=>clearInterval(timer);
  return d;
}

function stopThinking(target){
  if(!target) return;
  if(target.clear) target.clear();
  target.remove();
}

function setBusy(next){
  if(next) stopRecognition();
  busy=next;
  $("#child").disabled=next;
  $("#msg").disabled=next;
  $("#mic").disabled=next;
  $("#cam").disabled=next;
  $("#send").disabled=next||!$("#msg").value.trim();
}

let ttsEnabled=true, voice=null;
try{ttsEnabled=localStorage.getItem("mimamori_tts")!=="off";}catch(e){}
function updateTts(){
  $("#tts").textContent="読み上げ "+(ttsEnabled?"オン":"オフ");
  $("#tts").setAttribute("aria-pressed",String(ttsEnabled));
}
updateTts();
$("#tts").addEventListener("click",()=>{
  ttsEnabled=!ttsEnabled; updateTts();
  try{localStorage.setItem("mimamori_tts",ttsEnabled?"on":"off");}catch(e){}
  if(!ttsEnabled&&"speechSynthesis" in window) speechSynthesis.cancel();
});
function selectVoice(){
  const jaVoices=speechSynthesis.getVoices().filter(v=>v.lang==="ja-JP");
  voice=jaVoices.find(v=>/Google|Microsoft Nanami/i.test(v.name))||null;
}
if("speechSynthesis" in window){
  selectVoice();
  speechSynthesis.addEventListener("voiceschanged",selectVoice);
}
function say(text){
  if(!ttsEnabled||!("speechSynthesis" in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/\n+/g,"。"));
    u.lang="ja-JP"; u.rate=0.95; u.pitch=1.0;
    if(voice) u.voice=voice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

async function boot(){
  const c=await fetch("/api/config").then(r=>r.json()).catch(()=>({children:[]}));
  const sel=$("#child");
  (c.children||[]).forEach(x=>{ levels[x.name]=x.school_level; });
  sel.innerHTML=(c.children||[]).map(x=>'<option>'+esc(x.name)+"</option>").join("");
  child=sel.value||"";
  sel.addEventListener("change",()=>{stopRecognition();child=sel.value;history=[];thread.innerHTML="";boardDone=-1;refreshPoints();loadCards();loadBoard();open();});
  showOffline();
  flushOutbox();
  loadCapacity();
  refreshPoints();
  loadBoard();
  loadCards();
  open();
}

async function refreshPoints(){
  try{
    const t=await fetch("/api/tasks").then(r=>r.json());
    $("#pt").textContent=(t.points[child]||0)+" pt";
  }catch(e){ $("#pt").textContent="— pt"; }
}

// ------------------------------------------------------------ きょうのやること
//
// タップだけで終われるようにする。文字を読まなくても、絵と一言で分かる。
// **数は出さない。** 相棒が残りを数えない以上、画面が数えたら同じことになる。
// 承認まち（pending）は出さない。親が通していないものを子にやらせない。

const KIND_ICON={homework:"📖",deadline:"📮",bring:"🎒",event:"🎏"};
const DONE_LINES=["1つおわったね！","おわった！つぎいこう！","かたづいたね！"];
let lastLine=-1;

function doneLine(){
  let i=Math.floor(Math.random()*DONE_LINES.length);
  if(i===lastLine) i=(i+1)%DONE_LINES.length;   // 前と同じ文は返さない
  lastLine=i;
  return DONE_LINES[i];
}

async function loadCards(){
  const box=$("#today");
  if(!child){ box.replaceChildren(); return; }
  let items=[], t=null;
  try{
    t=await fetch("/api/tasks").then(r=>r.json());
    lsSet(CACHE_KEY,t);                  // 電波が切れた日のために取っておく
  }catch(e){
    t=lsGet(CACHE_KEY,null);             // つながらないときは、前に見えていたもの
  }
  if(!t){ box.replaceChildren(); return; }
  const sent=outboxIds();
  items=(t.items||[]).filter(x=>
    x.child===child && x.status!=="done" && x.status!=="pending" && x.days_left<=0
    && !sent.has(x.id));                 // 送り待ちのものは、もう出さない

  todayItems=items;
  renderFrame();
  box.replaceChildren();
  if(!items.length){
    const p=document.createElement("p");
    p.className="card-none";
    p.textContent="きょうは やることないよ！";
    box.appendChild(p);
    $("#frame").hidden=true;
    return;
  }
  for(const item of items){
    const b=document.createElement("button");
    b.type="button";
    b.className="card"+(item.days_left<0?" late":"");
    const title=String(item.summary||"").replace("✓ ","").split("｜").pop();
    b.innerHTML='<span class="ic" aria-hidden="true">'+(KIND_ICON[item.kind]||"📝")+
                '</span><span class="tx">'+esc(title)+"</span>"
                + (isOlder()&&item.minutes?'<span class="min">'+item.minutes+"分</span>":"");
    b.setAttribute("aria-label",title+" を おわりにする");
    b.addEventListener("click",()=>finishCard(item,b));
    if(isOlder()){
      // 「明日に送る」はカードの**下**に置く。押し間違えて完了になるのがいちばん困る。
      const wrap=document.createElement("div");
      wrap.className="cardwrap";
      wrap.appendChild(b);
      const later=document.createElement("button");
      later.type="button"; later.className="later"; later.textContent="明日に送る";
      later.setAttribute("aria-label",title+" を 明日に送る");
      later.addEventListener("click",e=>{ e.stopPropagation(); postpone(item,later); });
      wrap.appendChild(later);
      box.appendChild(wrap);
    }else{
      box.appendChild(b);
    }
  }
}

async function finishCard(item,el){
  if(el.disabled) return;
  el.disabled=true;
  try{
    const r=await fetch("/api/status",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({event_id:item.id,status:"done"})});
    if(!r.ok) throw new Error("status");
  }catch(e){
    // 届かなくても、押したことは受け取る。あとでこの端末から送る。
    queueDone(item.id);
  }
  el.classList.add("done");
  setTimeout(()=>{ (el.closest(".cardwrap")||el).remove(); if(!$("#today").querySelector(".card")) loadCards(); },260);
  const line=doneLine();
  add("bot",line);
  say(line);
  refreshPoints();
  loadBoard();
}

// ------------------------------------------------------------ 上の子モード
//
// 中学生には**量**を見せる。ただし数えるのは時間（NF：表示は量・内部は時間）。
// 入らない日はある。そこで詰め込ませるより、**1日ずらせる**ほうがいい。
// 「入りません」は出るときだけ出す。常設しない（画面設計 12-5）。

let levels={}, capacity=90, todayItems=[];

function isOlder(){ return levels[child]==="junior_high"; }

async function loadCapacity(){
  try{ capacity=(await fetch("/api/capacity").then(r=>r.json())).minutes||90; }catch(e){}
}

function renderFrame(){
  const box=$("#frame");
  if(!isOlder() || !todayItems.length){ box.hidden=true; return; }
  const total=todayItems.reduce((a,x)=>a+(x.minutes||0),0);
  box.hidden=false;
  let h='<div class="top"><span>きょうの枠</span>'
    + '<span class="tot">'+total+"分 / "+capacity+"分</span></div>"
    + '<div class="bar" role="img" aria-label="きょうの合計 '+total+"分、枠は"+capacity+'分">';
  let used=0;
  for(const it of todayItems){
    const m=it.minutes||0;
    const w=Math.max(2, Math.round(m/Math.max(capacity,total)*100));
    const over=used>=capacity;
    h+='<span class="seg'+(over?" over":"")+'" style="width:'+w+'%"></span>';
    used+=m;
  }
  h+="</div>";
  if(total>capacity){
    h+='<p class="msg">きょうの枠には入らない分があります。1つ「明日に送る」と入ります。</p>';
  }
  box.innerHTML=h;
}

async function postpone(item,el){
  el.disabled=true;
  try{
    const r=await fetch("/api/postpone",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({event_id:item.id})});
    if(!r.ok) throw new Error("ng");
  }catch(e){
    el.disabled=false;
    add("sys","いま動かせなかった。もう一回さわってみて");
    return;
  }
  add("bot","明日にうつしたよ");
  loadCards();
}

// ------------------------------------------------------------ 電波がないとき
//
// 家のどこかで電波が切れていても、タップは受け取る。**そこで止めると習慣が切れる。**
// 送れなかった「おわった」はこの端末に溜めて、つながったら順に送る。
// 溜まっていることで子に気を遣わせない。小さな一行だけ出す。

const OUT_KEY="mimamori-outbox", CACHE_KEY="mimamori-tasks";

function lsGet(k,fallback){
  try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fallback; }catch(e){ return fallback; }
}
function lsSet(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
}

function outbox(){ return lsGet(OUT_KEY,[]); }
function outboxIds(){ return new Set(outbox().map(x=>x.event_id)); }

function queueDone(id){
  const list=outbox();
  if(!list.some(x=>x.event_id===id)) list.push({event_id:id,status:"done",at:Date.now()});
  lsSet(OUT_KEY,list);
  showOffline();
}

function showOffline(){
  const n=outbox().length, el=$("#offline");
  if(!n){ el.hidden=true; el.textContent=""; return; }
  el.hidden=false;
  el.textContent="あとで おくるね（"+n+"つ）";
}

async function flushOutbox(){
  const list=outbox();
  if(!list.length) return;
  const rest=[];
  for(const job of list){
    try{
      const r=await fetch("/api/status",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({event_id:job.event_id,status:job.status})});
      if(!r.ok) throw new Error("ng");
    }catch(e){
      rest.push(job);            // まだ届かない。次の機会に送る
      continue;
    }
  }
  lsSet(OUT_KEY,rest);
  showOffline();
  if(rest.length!==list.length){ refreshPoints(); loadBoard(); }
}

window.addEventListener("online",flushOutbox);
setInterval(flushOutbox,60000);

// ------------------------------------------------------------ 週の台紙
//
// ★5つで1枚。**日曜に戻る**（週は日曜はじまり）。
// ここでも「あと2つ」とは言わない。済んだ数だけを見せる（A-7の態度ルール）。
// 5つ目が埋まったときだけ紙吹雪。毎回出すと、出たこと自体がうれしくなくなる。

const STAR_ON="⭐", STAR_OFF="☆";
let boardDone=-1;

async function loadBoard(){
  const box=$("#board");
  if(!child){ box.hidden=true; boardDone=-1; return; }
  let w=null;
  try{ w=await fetch("/api/week?child="+encodeURIComponent(child)).then(r=>r.json()); }
  catch(e){ box.hidden=true; return; }
  if(w.detail){ box.hidden=true; return; }

  const filled=Math.min(w.done,w.goal);
  const grew=boardDone>=0 && w.done>boardDone;
  const justFull=grew && w.done>=w.goal && boardDone<w.goal;

  box.hidden=false;
  box.classList.toggle("full", w.done>=w.goal);
  let h='<span class="lbl">こんしゅう</span><span class="slots" aria-hidden="true">';
  for(let i=0;i<w.goal;i++){
    h+='<span class="s'+(i<filled?" on":"")+(grew&&i===filled-1?" pop":"")+'">'
      +(i<filled?STAR_ON:STAR_OFF)+"</span>";
  }
  h+='</span><span class="cnt">'+w.done+"つ</span>";
  box.innerHTML=h;
  box.setAttribute("aria-label","こんしゅう "+w.done+"つ おわった");
  if(grew) setTimeout(()=>box.querySelectorAll(".pop").forEach(e=>e.classList.remove("pop")),300);

  boardDone=w.done;
  if(justFull){
    confetti();
    const line="だいしが いっぱいになったよ！";
    add("bot",line); say(line);
  }
}

function confetti(){
  const COLORS=["#0F6B62","#C2614A","#3F8A6E","#8A5AA8","#D6A63C"];
  const wrap=document.createElement("div");
  wrap.id="confetti";
  const quiet=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const n=quiet?0:34;
  for(let i=0;i<n;i++){
    const bit=document.createElement("i");
    bit.style.left=Math.random()*100+"vw";
    bit.style.background=COLORS[i%COLORS.length];
    bit.style.animationDelay=(Math.random()*0.5).toFixed(2)+"s";
    bit.style.animationDuration=(1.5+Math.random()*0.9).toFixed(2)+"s";
    wrap.appendChild(bit);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),3000);
}

function open(){
  add("sys","おかえり。");
  send(null, true);
}

function updateInput(){
  const input=$("#msg");
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,130)+"px";
  $("#send").disabled=!input.value.trim()||busy;
}
$("#msg").addEventListener("input",()=>{
  stopRecognition();
  $("#msg").classList.remove("interim");
  updateInput();
});
$("#msg").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}
});
$("#send").addEventListener("click",submit);

function submit(){
  const v=$("#msg").value.trim(); if(!v||busy) return;
  $("#msg").style.height="auto";
  send(v);
}

async function send(text, hidden){
  if(!hidden) add("me",text);
  const requestHistory=text==null?[]:history.concat({role:"user",text});
  if(text!=null) history.push({role:"user",text});
  setBusy(true); const t=thinking();
  const ac=new AbortController();
  const timeout=setTimeout(()=>ac.abort(),45000);
  try{
    const res=await fetch("/api/kid/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({child,history:requestHistory}),signal:ac.signal});
    const j=await res.json();
    stopThinking(t);
    if(!res.ok) throw new Error(j.detail||"うまく話せませんでした");
    add("bot",j.text);
    say(j.text);
    history.push({role:"assistant",text:j.text});
    if((j.tools||[]).some(n=>n==="finish_task"||n==="start_task")){ refreshPoints(); loadCards(); loadBoard(); }
    if(!hidden){ $("#msg").value=""; $("#msg").style.height="auto"; }
  }catch(e){
    stopThinking(t);
    if(e.name==="AbortError") add("sys","時間がかかりすぎた。もう一回送ってみて");
    else add("sys","うまくつながらなかった。もう一回ためしてみて。");
  }
  clearTimeout(timeout);
  setBusy(false);
}

/* ---- おたよりを撮る ---- */
$("#cam").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f||busy) return;
  e.target.value="";
  const url=URL.createObjectURL(f);
  add("shot","",'<img src="'+url+'" alt="撮ったおたより">');
  setBusy(true); const t=thinking();
  let registering=false;
  try{
    const fd=new FormData(); fd.append("image",f); fd.append("hint",child+"のぶん");
    const res=await fetch("/api/extract",{method:"POST",body:fd});
    const j=await res.json();
    if(!res.ok) throw new Error(j.detail||"読み取れませんでした");
    // すでにあるもの（完全一致）はサーバ側で外れている（D-1）。
    // 追記・日程変更は duplicate_of が付くが、**これは親に見せるべきもの**なので落とさない。
    const keep=(j.items||[]).filter(x=>x.branch!=="same");
    if(!keep.length){
      stopThinking(t);
      add("bot", j.skipped ? "ありがとう。もう入っているものだったよ。" : "ありがとう。これは新しく入れるものはなかったよ。");
      return;
    }
    registering=true;
    // 承認は挟まない（D-62）。挟むと、親が通し忘れた日は何も起きず、
    // 撮った子から見れば「出したのに無視された」になる。入れてから親に知らせる。
    const reg=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({items:keep,source:"kid"})});
    const registered=await reg.json();
    stopThinking(t);
    const added=(registered.results||[]).filter(x=>x.status==="ok");
    if(!reg.ok||added.length<keep.length) add("sys","わたせなかったものがある。おうちの人に見てもらってね。");
    if(!reg.ok||!added.length) return;
    add("sys","やることに入れました\n"
      +added.map(x=>"・"+String(x.title||"").replace(/^[^｜]*｜/,"").trim()).join("\n")
      +"\nおうちの人にも知らせておいたよ。");
    loadCards(); loadBoard();
    await send("おたよりを撮った。"+added.map(x=>x.title).join("、")+" をやることに入れた。", true);
  }catch(err){
    stopThinking(t);
    if(registering) add("sys","わたせたか確認できなかった。おうちの人に見てもらってね。");
    else{
      const retry=add("bot","",esc("うーん、うまく読めなかった。ちょっと暗いかも。もう一回撮れる？")+'<br><button type="button">もう一回撮る</button>');
      retry.querySelector("button").addEventListener("click",()=>{if(!busy) $("#cam").click();});
    }
  }finally{
    setBusy(false);
  }
});

/* ---- 声で話す ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=$("#mic");
if(!SR){ mic.style.display="none"; }
else{
  let rec=null, on=false;
  stopRecognition=()=>{
    if(rec){
      rec.onstart=rec.onresult=rec.onerror=rec.onend=null;
      if(on) rec.abort();
    }
    on=false;mic.classList.remove("rec");mic.setAttribute("aria-pressed","false");
    $("#msg").classList.remove("interim");
  };
  mic.addEventListener("click",()=>{
    if(busy) return;
    if(on){ rec && rec.stop(); return; }
    rec=new SR(); rec.lang="ja-JP"; rec.interimResults=true; rec.continuous=false;
    rec.onstart=()=>{on=true;mic.classList.add("rec");mic.setAttribute("aria-pressed","true");};
    rec.onresult=ev=>{
      if(busy) return;
      let s="", interim=false;
      for(const r of ev.results){s+=r[0].transcript;if(!r.isFinal) interim=true;}
      $("#msg").value=s;
      updateInput();
      $("#msg").classList.toggle("interim",interim);
    };
    rec.onerror=ev=>{
      if(ev.error==="not-allowed"||ev.error==="service-not-allowed") add("sys","マイクが使えない。文字で書いてみて");
      else if(ev.error==="no-speech") add("sys","聞こえなかった。もう一回押して話して");
    };
    rec.onend=()=>{
      on=false;mic.classList.remove("rec");mic.setAttribute("aria-pressed","false");
      $("#msg").classList.remove("interim");
    };
    try{ speechSynthesis.cancel(); }catch(e){}
    add("sys","マイクの許可が出たら、許可して話してね");
    try{on=true;rec.start();}catch(e){
      on=false;mic.classList.remove("rec");mic.setAttribute("aria-pressed","false");
      add("sys","マイクが使えない。文字で書いてみて");
    }
  });
}

boot();
</script>
