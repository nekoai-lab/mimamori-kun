<!doctype html>
<html lang="ja" data-audience="kid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きょう — みまもりくん</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/appearance.css">
<link rel="stylesheet" href="/static/reading.css">
<script src="/static/who.js" defer></script>
<style>
:root{--paper:#FAF7F0;--surface:#fff;--ink:#1F2422;--ink-2:#5A625F;--line:#CFC9B9;--me:#0F6B62;--me-ink:#fff}
:root[data-theme="dark"]{--paper:#14110C;--surface:#1E1B15;--ink:#F0ECE2;--ink-2:#B5AE9E;--line:#756F63;--me:#5FCFC0;--me-ink:#14110C}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--kid-bg,var(--paper));color:var(--kid-text,var(--ink));font:18px/1.6 system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit} button,a,input,textarea,summary{touch-action:manipulation}
button,summary{cursor:pointer} button,.link{min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--kid-card,var(--surface))}
button:disabled{cursor:default;opacity:.65} a{color:inherit} :focus-visible{outline:3px solid var(--kid-accent,var(--me));outline-offset:3px}
header,main,.page-bottom{max-width:640px;margin:auto;padding:12px 16px} .hdr,.heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:28px;margin:0}h2{font-size:20px;margin:0}p{margin:8px 0} .heading{justify-content:space-between}
.hdr{font-size:14px}.hdr details{position:relative}.hdr details[open]>div{position:absolute;top:100%;left:0;z-index:5;width:210px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.hdr details a{display:block;padding:12px}.pt{font-size:18px}.muted,.hint,.min{font-size:14px;color:var(--kid-muted,var(--ink-2))}
#today{display:flex;flex-direction:column;gap:10px;margin:12px 0;height:auto;max-height:none;overflow:visible} .card{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--kid-card,var(--surface));overflow-wrap:anywhere}
.card:first-child{border-width:2px}.task-info{min-width:0}.task-info summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px}.ic{font-size:28px}.tx{font-weight:700}.card p{font-size:14px}.card .finish{align-self:center;background:var(--kid-accent,var(--me));color:var(--kid-on-accent,var(--me-ink));font-weight:700}.card .status{grid-column:1/-1;margin:0}.card .later{grid-column:1/-1;justify-self:end}
.card.done{border-color:var(--kid-done,var(--me))}.stamp{animation:stamp .25s ease-out}@keyframes stamp{from{transform:scale(1.08)}to{transform:scale(1)}}
#companion{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--kid-card,var(--surface));margin:12px 0}.companion-top{display:flex;align-items:center;gap:12px}.companion-picture{width:76px;height:72px;flex:none}.resting .eyes{opacity:.4}
/* 相棒の着替え：テーマ（data-kid-theme）ごとに A の絵を出す。テーマがない（中立）ときは元の絵のまま。名前・会話・台紙は変えない */
.companion-art{display:none;width:76px;height:72px;flex:none;background:center/contain no-repeat}
:root[data-kid-theme="rocket-lab"] .companion-art[data-art="rocket-lab"]{display:block;background-image:url("/static/assets/appearance/rocket-lab.svg")}
:root[data-kid-theme="monochrome"] .companion-art[data-art="monochrome"]{display:block;background-color:var(--kid-text)}
:root[data-kid-theme="snow-bird"] .companion-art[data-art="snow-bird"]{display:block;background-image:url("/static/assets/appearance/snow-bird.svg")}
:root[data-kid-theme] .companion-picture{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.resting .companion-art{opacity:.6}.companion-top button{flex:1;text-align:left}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1;min-width:0}.companion-name{font-size:14px;display:block}
.page-bottom{padding-bottom:calc(var(--nav-height, 90px) + 24px)}.hint{text-align:center}
/* A 未読込時にも移動できる静的リンク。ナビの生成・置換は A が所有する。 */
[data-family-nav]{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--kid-card,var(--surface));padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
[data-family-nav] a{flex:1;max-width:200px;min-height:48px;text-align:center;padding:10px 4px;text-decoration:none;font-size:16px}[data-family-nav] [aria-current]{font-weight:700;border-bottom:3px solid currentColor}
/* 実測した入口の高さを元の位置にも確保し、台紙を下へ送る。 */
#companion-slot{display:flow-root}body.docked #companion-slot{height:var(--companion-space)}
body.docked #companion{position:fixed;bottom:calc(var(--nav-height, 90px) + 8px);left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:608px;margin:0;z-index:2;box-shadow:0 0 0 8px var(--kid-bg,var(--paper))}
body.docked .page-bottom{padding-bottom:calc(var(--nav-height, 90px) + var(--companion-space) + 24px)}
#recent{border:1px solid var(--line);border-radius:12px;padding:10px;overflow-wrap:anywhere}#recent p{margin:4px 0}#recent-result{font-weight:700}
html{scroll-padding-bottom:calc(var(--nav-height, 90px) + var(--companion-space, 0px) + 24px)}
#board{padding:12px;border:1px solid var(--line);border-radius:14px;margin:12px 0}#board.full{border:2px solid var(--kid-done,var(--me))}.slots{display:flex;gap:10px;font-size:24px}.s{color:var(--kid-muted,var(--ink-2))}.s.on{color:var(--kid-done,var(--me))}
#feedback,#load-note{font-size:14px}#records{margin:12px 0}#records>summary{min-height:48px}#records-list{display:grid;gap:10px}
dialog{width:min(640px,100%);max-height:90dvh;margin:auto auto 0;padding:16px;border:1px solid var(--line);border-radius:18px 18px 0 0;background:var(--kid-bg,var(--paper));color:inherit;overflow:auto}dialog::backdrop{background:#0006}.sheet-head{position:sticky;top:-16px;padding:8px 0;background:var(--kid-bg,var(--paper));z-index:1}
.sheet-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.sheet-head .hint{margin:4px 0}
.thread{display:flex;flex-direction:column;gap:12px;margin:16px 0;min-height:60px;overflow-wrap:anywhere}.msg{padding:10px 14px;max-width:90%;border-radius:14px;white-space:pre-wrap}.msg.bot{background:var(--kid-card,var(--surface));border:1px solid var(--line)}.nm{display:block;font-size:14px}.msg.me{align-self:flex-end;border:1px solid var(--line)}.msg.sys{font-size:14px}.compose{display:flex;gap:8px;flex-wrap:wrap}.compose textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}.compose button{flex:1}.naming{margin-top:16px}.naming input{width:100%;padding:8px;background:var(--surface);border:1px solid var(--line)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}#confetti i{position:absolute;top:25%;width:8px;height:12px;background:var(--me);animation:fall 1.1s ease-out forwards}@keyframes fall{to{transform:translateY(35vh) rotate(160deg);opacity:0}}
:root[data-kid-theme="monochrome"] .stamp{animation:none}:root[data-kid-theme="monochrome"] #confetti{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:340px),(max-height:500px){.card{grid-template-columns:1fr}.companion-top{flex-wrap:wrap}.actions{flex-wrap:wrap}.actions button{flex-basis:100%}}
body.large-controls #companion{position:static;transform:none;width:auto;margin:12px 0}
body.large-controls [data-family-nav]{position:static;flex-wrap:wrap}
body.large-controls .page-bottom{padding-bottom:24px}
#who-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--paper);padding:24px}#who-list{display:grid;gap:14px}.who-pick{display:flex;gap:16px;align-items:center}.who-face{padding:10px;border-radius:50%;background:var(--me);color:var(--me-ink)}
/* 上の子モード：枠バーと「明日に送る」 */
#frame{margin:10px 14px 0;padding:10px 12px;border:1px solid var(--line,#dcded6);border-radius:14px;
 background:var(--surface,#fff)}
#frame[hidden]{display:none}
#frame .top{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--ink-3,#7c8783)}
#frame .tot{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink,#191c1b);font-weight:700}
#frame .bar{display:flex;align-items:stretch;gap:3px;height:14px;margin:8px 0 0;border-radius:8px;overflow:hidden;
 background:var(--surface-2,#fbfbf7);border:1px solid var(--line,#dcded6)}
#frame .seg{align-self:stretch;min-height:12px;background:var(--kidA,#2f6690);opacity:.85}
#frame .seg:nth-child(even){opacity:.6}
#frame .over{background:var(--late-line,#b94f2b)}
#frame .msg{margin:7px 0 0;font-size:14px;color:var(--late-ink,#963c1e)}
.card .min{margin-left:auto;font-size:14px;color:var(--ink-3,#7c8783);font-variant-numeric:tabular-nums}
.card .later,.cardwrap .later{font:inherit;font-size:14px;padding:4px 9px;border-radius:8px;
 border:1px solid var(--line-strong,#c3c8bf);background:var(--surface-2,#fbfbf7);color:var(--ink-2,#4a524f)}

</style>
</head>
<body data-audience="kid">
<header><div class="hdr">
  <strong>みまもりくん</strong>
  <select id="child" hidden aria-label="いまの子"></select>
  <details data-profile-menu><summary id="child-name">プロフィール</summary><div><a href="/login?switch=parent">おうちの人へ</a></div></details>
  <span data-appearance-picker><button type="button" id="appearance-fallback" disabled>みため（じゅんび中）</button></span>
  <button id="theme" type="button">☾ 暗く</button>
  <button id="tts" type="button" aria-pressed="true">読み上げ オン</button>
</div></header>
<main id="main">
  <div class="heading"><h1>きょう</h1><a class="pt" id="pt" href="/reward" aria-label="ポイントとごほうび">— pt</a></div>
  <p id="load-note" role="status">よみこんでいるよ</p>
  <button id="reload" type="button" hidden>もういちど よみこむ</button>
  <section id="recent" aria-label="いまの完了" hidden>
    <p id="recent-result" role="status"></p><p id="recent-points"></p><p id="recent-week"></p>
    <button id="recent-undo" type="button">もどす</button>
  </section>
  <section id="today" aria-label="きょうのやること"></section>
  <section id="frame" aria-label="きょうの枠" hidden></section>
  <p id="feedback" role="status" aria-live="polite"></p>
  <div id="companion-slot"><section id="companion" aria-label="相棒">
    <div class="companion-top">
      <!-- テーマの着替え（A の結合（2））：テーマがあるときは A の絵を見せ、元の絵は読み上げ用に残す -->
      <span class="companion-art" data-art="rocket-lab" aria-hidden="true"></span><span class="companion-art ap-art-mono" data-art="monochrome" aria-hidden="true" style="--ap-mask:url('/static/assets/appearance/monochrome.svg')"></span><span class="companion-art" data-art="snow-bird" aria-hidden="true"></span>
      <svg class="companion-picture" viewBox="0 0 100 90" role="img" aria-label="相棒のまる" id="companion-picture">
        <path d="M50 23V12m-5 0a5 5 0 1 0 10 0a5 5 0 1 0-10 0" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="12" y="25" width="76" height="55" rx="25" fill="none" stroke="currentColor" stroke-width="3"/>
        <g class="eyes" fill="currentColor"><circle cx="35" cy="50" r="4"/><circle cx="65" cy="50" r="4"/></g><path d="M43 65q7 5 14 0" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <button id="bubble" type="button"><span class="companion-name" data-companion-name>まる</span><span id="greeting">きたね！</span></button>
    </div>
    <div class="actions"><button id="talk" type="button">はなす</button><button id="voice" type="button">🎤 こえで はなす</button></div>
    <p class="hint">やりとりは おうちの人も見られます</p>
  </section></div>
  <section id="board" aria-label="こんしゅうの だいし"><p>だいしを よみこんでいるよ</p></section>
  <details id="records"><summary>きょうの記録・もどす</summary><div id="records-list"></div></details>
  <a class="link" href="/reward">ごほうびを みる →</a>
</main>
<div class="page-bottom"></div>
<nav data-family-nav aria-label="画面を切り替える"><a href="/kid" aria-current="page">きょう</a><a href="/?mode=kid">とる</a><a href="/reward">ごほうび</a></nav>
<dialog id="chat" aria-labelledby="chat-title">
  <div class="sheet-head"><div class="sheet-title"><h2 id="chat-title"><span data-companion-name>まる</span>と はなす</h2><button id="close-chat" type="button">とじる</button></div>
  <p class="hint">やりとりは おうちの人も見られます</p></div>
  <div class="thread" id="thread" role="log" aria-live="polite"></div>
  <p id="mic-status" role="status"></p>
  <div class="compose"><textarea id="msg" rows="2" aria-label="はなしたいこと" placeholder="ここに書く"></textarea><button id="mic" type="button" aria-pressed="false">🎤 こえで はなす</button><button id="send" type="button" disabled>おくる</button></div>
  <button id="retry-chat" type="button" hidden>もういちど はなす</button>
  <details class="naming"><summary>なまえをつける</summary><form id="name-form"><label for="companion-input">あいぼうの なまえ（12文字まで）</label><input id="companion-input" autocomplete="off" placeholder="まる"><p id="name-preview">まる</p><button type="button" id="hear-name">こえで たしかめる</button><button type="submit" id="save-name">このなまえにする</button><button type="button" id="reset-name">まる にもどす</button><p id="name-status" role="status"></p></form></details>
</dialog>
<script src="/static/appearance.js"></script>
<script src="/static/reading.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const thread=$("#thread");
let child="", epoch=0, history=[], busy=false, levels={}, capacity=90, todayItems=[];
let taskSeq=0, weekSeq=0, snapshot=null, stale=false, companionName="まる", readingPolicy={};
let stopRecognition=()=>{}, chatAbort=null, chatStarted=false, lastChat=null, opener=null;
const jobs=new Map(), completedHere=new Map(), weekStates=new Map(), moving=new Set();
const CACHE_KEY="mimamori-kid-tasks-v2", OUT_KEY="mimamori-kid-outbox-v2";
function lsGet(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback;}catch(e){return fallback;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function scope(){return {child,epoch};}
function current(s){return s.child===child&&s.epoch===epoch;}
function isOlder(){return levels[child]==="junior_high";}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function textInto(el,text,contentRole="ui"){
  el.textContent=text;
  // H が未接続・辞書失敗なら原文。問題の読みをここで推測しない。
  try{const r=window.Reading?.render(text,readingPolicy,{contentRole});if(r?.fragment instanceof DocumentFragment) el.replaceChildren(r.fragment);}catch(e){}
}
function feedback(text){$("#feedback").textContent=text;}
function companionLine(text){textInto($("#greeting"),text);add("bot",text);say(text);}
function add(kind,text){const d=document.createElement("div");d.className="msg "+kind;if(kind==="bot"){const n=document.createElement("span");n.className="nm";n.textContent=companionName;d.append(n);}const t=document.createElement("span");textInto(t,text,"conversation");d.append(t);thread.append(d);return d;}
async function getJSON(url,options){const r=await fetch(url,options);if(!r.ok){const e=new Error("HTTP");e.http=true;throw e;}return r.json();}
let ttsEnabled=true, voice=null;
try{ttsEnabled=localStorage.getItem("mimamori_tts")!=="off";}catch(e){}
function updateTts(){
  $("#tts").textContent="読み上げ "+(ttsEnabled?"オン":"オフ");
  $("#tts").setAttribute("aria-pressed",String(ttsEnabled));
}
updateTts();
$("#tts").addEventListener("click",()=>{
  ttsEnabled=!ttsEnabled; updateTts();
  try{localStorage.setItem("mimamori_tts",ttsEnabled?"on":"off");}catch(e){}
  if(!ttsEnabled&&"speechSynthesis" in window) speechSynthesis.cancel();
});
function selectVoice(){
  const jaVoices=speechSynthesis.getVoices().filter(v=>v.lang==="ja-JP");
  voice=jaVoices.find(v=>/Google|Microsoft Nanami/i.test(v.name))||null;
}
if("speechSynthesis" in window){
  selectVoice();
  speechSynthesis.addEventListener("voiceschanged",selectVoice);
}
function say(text){
  if(!ttsEnabled||!("speechSynthesis" in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/\n+/g,"。"));
    u.lang="ja-JP"; u.rate=0.95; u.pitch=1.0;
    if(voice) u.voice=voice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}


function renderFrame(){
  const box=$("#frame");
  if(!isOlder() || !todayItems.length){ box.hidden=true; return; }
  const total=todayItems.reduce((a,x)=>a+(x.minutes||0),0);
  box.hidden=false;
  let h='<div class="top"><span>きょうの枠</span>'
    + '<span class="tot">'+total+"分 / "+capacity+"分</span></div>"
    + '<div class="bar" role="img" aria-label="きょうの合計 '+total+"分、枠は"+capacity+'分">';
  let used=0;
  for(const it of todayItems){
    const m=it.minutes||0;
    const w=Math.max(2, Math.round(m/Math.max(capacity,total)*100));
    const over=used>=capacity;
    h+='<span class="seg'+(over?" over":"")+'" style="width:'+w+'%"></span>';
    used+=m;
  }
  h+="</div>";
  if(total>capacity){
    h+='<p class="msg">きょうの枠には入らない分があります。1つ「明日に送る」と入ります。</p>';
  }
  box.innerHTML=h;
}


async function boot(){
  const sel=$("#child");
  // 認証未導入の 401/404 は従来動作。子の選択・復元は who.js に任せる。
  const [c,me]=await Promise.all([
    getJSON("/api/config").catch(()=>null),
    getJSON("/api/auth/me").catch(()=>null),
  ]);
  if(me?.role==="child"||me?.role==="parent"){
    document.documentElement.dataset.audience=me.role==="parent"?"parent":"kid";
    document.body.dataset.audience=document.documentElement.dataset.audience;
  }
  if(!c){$("#load-note").textContent="きょうのやることを よみこめなかったよ";$("#reload").hidden=false;return;}
  (c.children||[]).forEach(x=>{levels[x.name]=x.school_level;});
  sel.addEventListener("change",showChild);
  sel.addEventListener("who:ready",showChild);
  sel.innerHTML=(c.children||[]).map(x=>'<option>'+esc(x.name)+'</option>').join("");
  if(!sel.options.length) $("#load-note").textContent="おうちの人に 子のせっていを たのんでね";
  try{capacity=(await getJSON("/api/capacity")).minutes||90;renderFrame();}catch(e){}
}
function showChild(){
  const next=$("#child").value||"";
  if(!next||next===child)return;
  stopRecognition();chatAbort?.abort();if($("#chat").open)$("#chat").close();
  child=next;recentJob=null;$("#recent").hidden=true;$("#records").open=false;epoch++;taskSeq++;weekSeq++;history=[];snapshot=null;stale=false;
  busy=false;chatStarted=false;lastChat=null;thread.replaceChildren();todayItems=[];renderFrame();
  $("#msg").value="";$("#retry-chat").hidden=true;$("#mic-status").textContent="";updateInput();
  $("#child-name").textContent=child;$("#pt").textContent="— pt";
  $("#today").replaceChildren();$("#records-list").replaceChildren();feedback("");
  $("#board").textContent="だいしを よみこんでいるよ";$("#board").classList.remove("full");
  $("#greeting").textContent="きたね！";$("#companion").classList.remove("resting");
  companionName="まる";readingPolicy={};paintName();$("#companion-input").value="";$("#name-preview").textContent="まる";$("#name-status").textContent="";$("#save-name").disabled=false;
  const saved=lsGet(OUT_KEY,[]);
  if(Array.isArray(saved))for(const j of saved){if(j.child===child&&!jobs.has(jobKey(j.child,j.item.id))){j.state="waiting";jobs.set(jobKey(j.child,j.item.id),j);}}
  try{Promise.resolve(window.Appearance?.setChild(child)).catch(()=>{});}catch(e){}
  loadName();loadCards();loadBoard();flushOutbox();
}
$("#reload").addEventListener("click",()=>child?loadCards():location.reload());
function jobKey(who,id){return JSON.stringify([who,id]);}
function myJobs(){return [...jobs.values()].filter(j=>j.child===child);}
function persistJobs(){
  const other=lsGet(OUT_KEY,[]);
  const pending=[...(Array.isArray(other)?other:[]).filter(j=>!jobs.has(jobKey(j.child,j.item.id))),
    ...[...jobs.values()].filter(j=>["waiting","sending"].includes(j.state))];
  return lsSet(OUT_KEY,pending);
}
async function loadCards(){
  if(!child)return;
  const s=scope(),seq=++taskSeq;
  $("#load-note").textContent="よみこんでいるよ";$("#reload").hidden=true;
  let t;
  try{
    t=await getJSON("/api/tasks");
    if(!Array.isArray(t.items)||!t.points)throw new Error("invalid tasks");
    if(!current(s)||seq!==taskSeq)return;
    // キャッシュにはこの子のデータだけを残す。
    snapshot={items:t.items.filter(x=>x.child===child),points:t.points[child],today:t.today,at:Date.now()};
    stale=false;lsSet(CACHE_KEY+":"+child,snapshot);
    $("#pt").textContent=Number.isFinite(snapshot.points)?snapshot.points+" pt":"— pt";
    $("#load-note").textContent="";
  }catch(e){
    if(!current(s)||seq!==taskSeq)return;
    snapshot=lsGet(CACHE_KEY+":"+child,null);stale=true;$("#pt").textContent="— pt";$("#reload").hidden=false;
    $("#load-note").textContent=snapshot?"前にひらいたときの内容だよ（"+new Date(snapshot.at).toLocaleString("ja-JP")+"）":"きょうのやることを よみこめなかったよ";
  }
  renderCards();
  return stale?null:snapshot;
}
const KIND_ICON={homework:"📖",deadline:"📮",bring:"🎒",event:"🎏"};
const DONE_LINES=["1つおわったね！","かたづいたね！","おわったね！"];
let lastLine=-1, recentJob=null, mutationVersion=0;
function doneLine(){lastLine=(lastLine+1)%DONE_LINES.length;return DONE_LINES[lastLine];}
function button(text,action){const b=document.createElement("button");b.type="button";b.textContent=text;b.addEventListener("click",action);return b;}
function displayTaskTitle(item){
  const title=String(item.summary||"").replace(/^✓\s*/,"");
  const prefix=String(item.child||child)+"｜";
  return title.startsWith(prefix)?title.slice(prefix.length):title;
}
function renderCards(){
  const focused=document.activeElement, focusedRow=focused?.closest(".card");
  const focusedID=focusedRow?.dataset.itemId;
  const box=$("#today"),records=$("#records-list");box.replaceChildren();records.replaceChildren();
  const items=(snapshot?.items||[]).filter(x=>x.status!=="pending"&&x.status!=="rejected"&&x.days_left<=0);
  // Array.sort は日付の同値で既存順を維持する。
  items.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for(const j of myJobs())if(!items.some(x=>x.id===j.item.id))items.push(j.item);
  todayItems=[];
  for(const item of items){
    const j=jobs.get(jobKey(child,item.id));
    if(j?.state==="restored")item.status=j.previous;
    const done=j?j.state==="done"||(j.target!=="done"&&j.state!=="restored"):item.status==="done";
    if(!done)todayItems.push(item);
    const row=document.createElement("article");row.className="card"+(done?" done":"");row.dataset.itemId=String(item.id);
    const info=document.createElement("details");info.className="task-info";
    const summary=document.createElement("summary");
    const icon=document.createElement("span");icon.className="ic";icon.setAttribute("aria-hidden","true");icon.textContent=KIND_ICON[item.kind]||"📝";
    const title=document.createElement("span");title.className="tx";
    textInto(title,displayTaskTitle(item),"taskTitle");summary.append(icon,title);info.append(summary);
    const detail=document.createElement("p");detail.textContent=[item.summary,item.bring,item.date].filter(Boolean).join(" · ");info.append(detail);
    if(isOlder()&&item.minutes){const min=document.createElement("span");min.className="min";min.textContent=item.minutes+"分";info.append(min);}
    row.append(info);
    const active=j?.state==="sending";
    const pending=j&&["waiting","error","sending"].includes(j.state);
    if(done||pending){
      const status=document.createElement("p");status.className="status";
      status.textContent=active?(j.undoRequested?"おくったあとに もどすね":"記録しているよ"):
        j?.state==="waiting"?(j.target==="done"?"おくるのを まっているよ":"もどせたか まだ たしかめられないよ"):
        j?.state==="error"?(j.target==="done"?"まだ記録できていないよ":"まだ もどせていないよ"):"✓ おわった";
      row.append(status);
      if(pending&&!active)row.append(button("もういちど",()=>runJob(j)));
      const undo=button("もどす",()=>undoItem(item));undo.className="undo";undo.setAttribute("aria-label",displayTaskTitle(item)+"の完了をもどす");undo.disabled=!!j?.undoRequested||!!(pending&&j.target!=="done");row.append(undo);
    }else{
      const finish=button("おわった",()=>finishCard(item));finish.className="finish";finish.setAttribute("aria-label",displayTaskTitle(item)+"を、おわりにする");row.append(finish);
      if(isOlder()){const later=button("明日に送る",()=>postpone(item,later));later.className="later";row.append(later);}
    }
    if(moving.has(jobKey(child,item.id)))row.querySelectorAll("button").forEach(b=>b.disabled=true);
    (done?records:box).append(row);
  }
  if(snapshot&&!todayItems.length){
    const finished=!stale&&(completedHere.get(child)===snapshot.today||items.some(x=>x.status==="done"&&x.date===snapshot.today));
    const p=document.createElement("p");p.textContent=finished?"きょうのぶん おわったね！":stale?"前の内容を 表示しているよ":"きょうは やることないよ";box.append(p);
    $("#companion").classList.toggle("resting",!finished);
  }else $("#companion").classList.remove("resting");
  renderRecent();renderFrame();scheduleLayout();
  if(focusedID!==undefined){
    const row=[...box.children,...records.children].find(r=>r.dataset.itemId===focusedID);
    const next=recentJob&&String(recentJob.item.id)===focusedID&&!$("#recent").hidden?$("#recent-undo"):
      row?.querySelector(".finish")||row?.querySelector(".undo")||box.querySelector(".finish")||$("#talk");
    if(!next.disabled)next.focus();else ($("#recent").hidden?$("#talk"):$("#recent-result")).focus();
  }
}
function finishCard(item){
  const key=jobKey(child,item.id),previous=jobs.get(key);
  if(moving.has(key)||(previous&&previous.state!=="restored"))return;
  const j={child,item:{...item},previous:item.status==="doing"?"doing":"todo",target:"done",state:"waiting",attempted:false,undoRequested:false};
  const prior=lsGet("mimamori-kid-previous:"+child,{});
  prior[item.id]=j.previous;lsSet("mimamori-kid-previous:"+child,prior);
  jobs.set(key,j);runJob(j);
}
async function runJob(j){
  if(j.state==="sending"||j.child!==child)return;
  if(navigator.onLine===false){j.state="waiting";const saved=persistJobs();renderCards();if(!saved)feedback("この画面を とじると 送信待ちは きえるよ");return;}
  const s=scope(),day=snapshot?.today,beforePoints=stale?null:snapshot?.points,version=++mutationVersion;j.state="sending";j.attempted=true;taskSeq++;persistJobs();renderCards();
  let accepted=false;
  try{
    const r=await getJSON("/api/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event_id:j.item.id,status:j.target})});
    if(r.status!==j.target){const e=new Error("rejected");e.http=true;throw e;}
    accepted=true;j.state=j.target==="done"?"done":"restored";
    if(j.state==="done"&&day)completedHere.set(j.child,day);
    else{j.item.status=j.previous;completedHere.delete(j.child);}
  }catch(e){j.state=e instanceof TypeError?"waiting":"error";}
  persistJobs();
  // 送信中の取消は結果のあとに直前の状態を送る。通信結果不明でも順序を逆転しない。
  if(j.undoRequested){j.undoRequested=false;j.target=j.previous;j.state="waiting";persistJobs();if(current(s))await runJob(j);return;}
  if(!current(s))return;
  if(accepted){
    if(j.target==="done"){
      $("#recent-result").classList.remove("stamp");
      recentJob=j;j.confirmedPoints=null;j.confirmedWeek=null;
      companionLine(doneLine());feedback("");
    }else feedback("もどしたよ");
    renderCards();
    const [tasks,week]=await Promise.all([loadCards(),loadBoard()]);
    if(!current(s)||recentJob!==j||j.state!=="done"||j.target!=="done")return;
    // 残高の差がこの項目の配点と一致し、同時操作がないときだけ増分を示す。
    const delta=tasks?.points-beforePoints;
    if(version===mutationVersion&&Number.isFinite(beforePoints)&&Number.isFinite(tasks?.points)&&
      j.item.points>0&&delta===j.item.points)j.confirmedPoints=delta;
    j.confirmedWeek=week||null;renderRecent();
    $("#recent-result").classList.add("stamp");
  }else{renderCards();feedback(j.state==="waiting"?"おくるのを まっているよ。ポイントは まだ たしかめていないよ":"まだ記録できていないよ");}
}
function undoItem(item){
  const key=jobKey(child,item.id);let j=jobs.get(key);
  mutationVersion++;
  if(j?.state==="sending"){j.undoRequested=true;renderCards();return;}
  if(j?.state==="waiting"&&!j.attempted){jobs.delete(key);const saved=lsGet(OUT_KEY,[]);lsSet(OUT_KEY,Array.isArray(saved)?saved.filter(x=>jobKey(x.child,x.item.id)!==key):[]);renderCards();return;}
  if(!j){const prior=lsGet("mimamori-kid-previous:"+child,{});j={child,item:{...item},previous:prior[item.id]==="doing"?"doing":"todo",attempted:true};jobs.set(key,j);}
  j.target=j.previous;j.state="waiting";runJob(j);
}
async function flushOutbox(){for(const j of myJobs())if(j.state==="waiting")await runJob(j);}
window.addEventListener("online",flushOutbox);
setInterval(flushOutbox,60000);
async function postpone(item,el){
  const key=jobKey(child,item.id);
  if(el.disabled||moving.has(key)||jobs.get(key)?.state==="sending")return;
  moving.add(key);
  const s=scope(),row=el.closest(".card");row.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{const r=await getJSON("/api/postpone",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event_id:item.id})});if(r.status==="error")throw new Error("postpone");if(!current(s))return;feedback("明日にうつしたよ");await loadCards();}
  catch(e){if(current(s)){row.querySelectorAll("button").forEach(b=>b.disabled=false);feedback("いま動かせなかった。もういちど ためしてね");}}
  finally{moving.delete(key);if(current(s))renderCards();}
}
async function loadBoard(){
  if(!child)return;
  const s=scope(),seq=++weekSeq,box=$("#board");
  try{
    const w=await getJSON("/api/week?child="+encodeURIComponent(child));
    if(!current(s)||seq!==weekSeq)return;
    if(w.child!==child||!w.start||!Number.isInteger(w.done)||!Number.isInteger(w.goal)||w.goal<=0||w.goal>100||w.done<0)throw new Error("week");
    const key=JSON.stringify([child,w.start]),previous=weekStates.get(key);
    const celebrated=lsGet("mimamori-kid-celebrated:"+key,false);
    const justFull=previous!==undefined&&previous<w.goal&&w.done>=w.goal&&!celebrated;
    weekStates.set(key,w.done);box.classList.toggle("full",w.done>=w.goal);
    box.innerHTML='<strong>こんしゅうの だいし</strong><span class="slots" aria-hidden="true">'+Array.from({length:w.goal},(_,i)=>'<span class="s'+(i<w.done?' on':'')+'">'+(i<w.done?'★':'☆')+'</span>').join("")+'</span><span>'+w.done+'つ おわった</span>';
    if(w.done>=w.goal)lsSet("mimamori-kid-celebrated:"+key,true);
    if(justFull){companionLine("だいしが いっぱいになったよ！");confetti();}
    return w;
  }catch(e){if(!current(s)||seq!==weekSeq)return;box.classList.remove("full");box.textContent="だいしを よみこめなかったよ";box.append(button("もういちど",loadBoard));}
}
function confetti(){
  if(document.documentElement.dataset.kidTheme==="monochrome"||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const wrap=document.createElement("div");wrap.id="confetti";wrap.setAttribute("aria-hidden","true");
  for(let i=0;i<12;i++){const bit=document.createElement("i");bit.style.left=(20+Math.random()*60)+"%";wrap.append(bit);}document.body.append(wrap);setTimeout(()=>wrap.remove(),1200);
}

// F が接続する子別の設定アダプタ。HTTP の口はここでは新設しない。
// CompanionStore.read(childKey) / write(childKey, {companion_name})。
// テーマ・学年をまとめて送り直さず、名前だけの部分更新を要求する。
function paintName(){document.querySelectorAll("[data-companion-name]").forEach(el=>el.textContent=companionName);thread.querySelectorAll(".nm").forEach(el=>el.textContent=companionName);$("#companion-picture").setAttribute("aria-label","相棒の"+companionName);}
let nameVersion=0;
async function loadName(){
  const s=scope(),version=++nameVersion;
  try{if(!window.CompanionStore?.read)throw new Error("unconnected");const settings=await window.CompanionStore.read(child);if(!current(s)||version!==nameVersion)return;companionName=typeof settings?.companion_name==="string"&&settings.companion_name.trim()?settings.companion_name:"まる";readingPolicy=settings?.reading_policy||{};paintName();$("#companion-input").value=companionName;$("#name-preview").textContent=companionName;}catch(e){if(current(s))$("#name-status").textContent="なまえを よみこめなかったよ。いまは まる だよ";}
}
function previewName(){const name=$("#companion-input").value.trim()||"まる";$("#name-preview").textContent=name;return name;}
$("#companion-input").addEventListener("input",previewName);
$("#hear-name").addEventListener("click",()=>say(previewName()));
$("#reset-name").addEventListener("click",()=>{$("#companion-input").value="まる";previewName();});
$("#name-form").addEventListener("submit",async e=>{
  e.preventDefault();if(!child||$("#save-name").disabled)return;
  const name=previewName();if([...name].length>12){$("#name-status").textContent="12文字までに してね";return;}
  const s=scope();++nameVersion;companionName=name;paintName();$("#save-name").disabled=true;
  $("#name-status").textContent="なまえを おぼえているよ";
  try{if(!window.CompanionStore?.write)throw new Error("unconnected");await window.CompanionStore.write(child,{companion_name:name});if(current(s))$("#name-status").textContent="このなまえを おぼえたよ";}
  catch(e){if(current(s))$("#name-status").textContent="この画面では変えたけれど、まだ覚えられていないよ。もういちど「このなまえにする」で ためしてね";}
  finally{if(current(s))$("#save-name").disabled=false;}
});
function updateInput(){$("#send").disabled=busy||!child||!$("#msg").value.trim();$("#msg").disabled=busy;$("#mic").disabled=busy;}
function openChat(source){opener=source;if(!$("#chat").open)$("#chat").showModal();$("#msg").focus();if(!chatStarted){add("bot","きたね！ はなしてみる？");chatStarted=true;}}
$("#talk").addEventListener("click",()=>openChat($("#talk")));
$("#bubble").addEventListener("click",()=>openChat($("#bubble")));
$("#voice").addEventListener("click",()=>{openChat($("#voice"));startRecognition();});
$("#close-chat").addEventListener("click",()=>$("#chat").close());
$("#chat").addEventListener("close",()=>{stopRecognition();try{speechSynthesis.cancel();}catch(e){}opener?.focus();});
$("#msg").addEventListener("input",()=>{stopRecognition();updateInput();});
$("#msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}});
$("#send").addEventListener("click",submit);
$("#retry-chat").addEventListener("click",()=>{if(lastChat)send(lastChat,true);});
function submit(){const text=$("#msg").value.trim();if(text&&!busy&&child)send(text);}
async function send(text,retry=false){
  if(busy||!child)return;
  const s=scope();stopRecognition();busy=true;updateInput();$("#retry-chat").hidden=true;lastChat=text;
  if(!retry)add("me",text);
  const waiting=add("sys","いま 考えているよ");const ac=new AbortController();chatAbort=ac;const timer=setTimeout(()=>ac.abort(),45000);
  try{
    const requestHistory=history.concat({role:"user",text});
    const j=await getJSON("/api/kid/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({child:s.child,history:requestHistory}),signal:ac.signal});
    if(!current(s))return;
    if(typeof j.text!=="string")throw new Error("chat");
    history=requestHistory.concat({role:"assistant",text:j.text}).slice(-38);add("bot",j.text);if($("#chat").open)say(j.text);$("#msg").value="";
    if((j.tools||[]).some(n=>n==="finish_task"||n==="start_task")){loadCards();loadBoard();}
  }catch(e){if(current(s)){add("sys","いまは うまく話せないよ。もういちど ためしてね");$("#retry-chat").hidden=false;}}
  finally{clearTimeout(timer);waiting.remove();if(current(s)){busy=false;updateInput();}}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recording=false;
stopRecognition=()=>{
  if(rec){rec.onstart=rec.onresult=rec.onerror=rec.onend=null;try{rec.abort();}catch(e){}rec=null;}
  recording=false;$("#mic").textContent="🎤 こえで はなす";$("#mic").setAttribute("aria-pressed","false");$("#msg").classList.remove("interim");$("#mic-status").textContent="";
};
function startRecognition(){
  if(busy)return;
  if(recording){stopRecognition();return;}
  if(!SR){$("#mic-status").textContent="この端末では マイクが使えないよ。文字で書いてね";$("#msg").focus();return;}
  const s=scope();rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.continuous=false;recording=true;
  $("#mic").textContent="とめる";$("#mic").setAttribute("aria-pressed","true");$("#mic-status").textContent="マイクの許可が出たら 許可してね";
  rec.onstart=()=>{if(current(s))$("#mic-status").textContent="きいているよ／とめる";};
  rec.onresult=ev=>{if(!current(s)||!$("#chat").open)return;let text="";for(const r of ev.results)text+=r[0].transcript;$("#msg").value=text;updateInput();};
  rec.onerror=ev=>{const message=ev.error==="no-speech"?"聞こえなかったよ。もういちど はなしてね":"マイクが使えないよ。文字で書いてね";stopRecognition();if(current(s)){$("#mic-status").textContent=message;$("#msg").focus();}};
  rec.onend=()=>{stopRecognition();};
  try{speechSynthesis.cancel();}catch(e){}
  try{rec.start();}catch(e){stopRecognition();$("#mic-status").textContent="マイクが使えないよ。文字で書いてね";}
}
$("#mic").addEventListener("click",startRecognition);
// 取消は時間で消さない。記録は本人が開くまで折りたたんだまま。
function renderRecent(){
  const j=recentJob,box=$("#recent"),undo=$("#recent-undo"),result=$("#recent-result");
  const visible=j&&j.child===child&&j.state!=="restored";
  if(!visible){
    const hadFocus=document.activeElement===undo||document.activeElement===$("#recent-result");
    box.hidden=true;
    if(hadFocus){
      const available=[...$("#today").querySelectorAll(".finish")].filter(b=>!b.disabled);
      const restored=available.find(b=>b.closest(".card")?.dataset.itemId===String(j?.item.id));
      (restored||available[0]||$("#talk")).focus();
    }
    return;
  }
  box.hidden=false;box.dataset.itemId=String(j.item.id);
  $("#recent-result").textContent=displayTaskTitle(j.item)+"："+
    (j.target==="done"?"✓ おわった":j.state==="error"?"まだ もどせていないよ":
      j.state==="waiting"?"もどせたか まだ たしかめられないよ":"もどしているよ");
  $("#recent-result").setAttribute("tabindex","-1");
  const pending=j.state==="sending"||!!j.undoRequested;
  // 無効化するとフォーカスがbodyへ落ちるので、その前に結果欄へ引き継ぐ。
  if(pending&&document.activeElement===undo)result.focus();
  undo.disabled=pending;
  undo.textContent=j.target!=="done"&&j.state!=="sending"?"もういちど もどす":"もどす";
  undo.setAttribute("aria-label",displayTaskTitle(j.item)+"の完了をもどす");
  if(!pending&&j.target!=="done"&&document.activeElement===result)undo.focus();
  $("#recent-points").textContent=j.target==="done"&&j.confirmedPoints?"+"+j.confirmedPoints+" pt":"";
  $("#recent-week").textContent=j.target==="done"&&j.confirmedWeek?"こんしゅうの だいし："+j.confirmedWeek.done+"つ おわった":"";
  scheduleLayout();
}
$("#recent-undo").addEventListener("click",()=>{if(recentJob)undoItem(recentJob.item);});
// 件数ではなく、折り返し・読み補助・文字拡大後の実寸で配置を決める。
function layoutConversation(){
  const companion=$("#companion"),slot=$("#companion-slot"),nav=$("[data-family-nav]");
  const viewport=window.visualViewport;
  const height=viewport?.height||window.innerHeight,width=viewport?.width||window.innerWidth;
  const navHeight=nav.getBoundingClientRect().height;
  const companionHeight=companion.getBoundingClientRect().height;
  const large=width<=340||height<=500||companionHeight+navHeight+160>height;
  const naturalBottom=slot.getBoundingClientRect().top+window.scrollY+companionHeight+24;
  document.body.classList.toggle("large-controls",large);
  document.body.classList.toggle("docked",!large&&naturalBottom>height-navHeight-8);
  document.documentElement.style.setProperty("--nav-height",navHeight+"px");
  document.documentElement.style.setProperty("--companion-space",(companionHeight+24)+"px");
}
let layoutFrame=0;
function scheduleLayout(){
  if(layoutFrame)return;
  layoutFrame=requestAnimationFrame(()=>{layoutFrame=0;layoutConversation();});
}
if(window.ResizeObserver){
  const observer=new ResizeObserver(scheduleLayout);
  for(const selector of ["header","#today","#frame","#feedback","#recent","#companion","[data-family-nav]"])observer.observe($(selector));
}
window.addEventListener("resize",scheduleLayout);
window.visualViewport?.addEventListener("resize",scheduleLayout);
document.fonts?.ready.then(scheduleLayout);
scheduleLayout();
boot();
</script>
