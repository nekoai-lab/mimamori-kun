<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みまもりくん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="/static/theme.js"></script>
<script src="/static/who.js" defer></script>
<style>
:root{
  --paper:#F6F6F1;--surface:#fff;--surface-2:#FBFBF7;
  --ink:#191C1B;--ink-2:#4A524F;--ink-3:#7C8783;
  --line:#DCDED6;--line-strong:#C3C8BF;
  --accent:#0F6B62;--accent-soft:#E2F0ED;
  --warn:#B94F2B;--warn-soft:#F7E7DF;
  --shadow:0 1px 2px rgba(25,28,27,.05),0 8px 24px -16px rgba(25,28,27,.25);
}
:root[data-theme="dark"]{
  --paper:#101413;--surface:#191E1D;--surface-2:#151A19;
  --ink:#ECEFEB;--ink-2:#AFB9B5;--ink-3:#7E8A86;
  --line:#2A3231;--line-strong:#3A4442;
  --accent:#5FCFC0;--accent-soft:#14302C;
  --warn:#E8926B;--warn-soft:#33211A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 80px}
header{border-bottom:1px solid var(--line);margin-bottom:24px;background:var(--paper)}
.hdr{max-width:720px;margin:0 auto;padding:16px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:"Zen Old Mincho",serif;font-size:21px;margin:0;letter-spacing:.04em}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.nav{flex-basis:100%;display:flex;gap:6px;overflow-x:auto}
.nav a{flex:none;font-size:12.5px;text-decoration:none;padding:4px 12px;white-space:nowrap;
  border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-2)}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.theme{margin-left:auto;flex:none;font:inherit;font-size:12.5px;padding:4px 12px;white-space:nowrap;
  border:1px solid var(--line-strong);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer}
.lead{color:var(--ink-2);font-size:14px;margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:18px}
label.file{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:2px dashed var(--line-strong);border-radius:5px;padding:32px 18px;cursor:pointer;
  background:var(--surface-2);text-align:center;transition:border-color .15s,background .15s}
label.file:hover,label.file:focus-within{border-color:var(--accent);background:var(--accent-soft)}
label.file .big{font-size:15px;font-weight:700}
label.file .sm{font-size:12.5px;color:var(--ink-3)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#preview{display:none;margin-top:14px;border:1px solid var(--line);border-radius:4px;max-width:100%}
.hintwrap{margin-top:14px}
.hintwrap label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:3px;padding:8px 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:700;font-size:14.5px;border-radius:4px;padding:12px 22px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.spinner{width:15px;height:15px;border:2px solid var(--accent-soft);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-family:"Zen Old Mincho",serif;font-size:19px;margin:32px 0 6px;letter-spacing:.03em}
.summary{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.trace{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:16px}
.trace div+div{margin-top:3px}
.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 4px 4px 0;box-shadow:var(--shadow);padding:14px}
.item.dup{border-left-color:var(--line-strong);opacity:.72}
.item.review{border-left-color:var(--warn)}
.item-head{display:flex;gap:10px;align-items:flex-start}
.item-head input[type=checkbox]{margin-top:6px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.item-title{flex:1;font-weight:700;font-size:15px;border:0;background:transparent;padding:2px 0;color:var(--ink)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 27px}
.badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:2px}
.b-kind{background:var(--accent-soft);color:var(--accent)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
/* 4分岐のバッジ（D-1） */
.b-new{background:var(--accent);color:#fff}
.b-diff{background:var(--warn-soft);color:var(--warn)}
.b-moved{background:var(--late,#b3402015);color:var(--late-ink,#963c1e);border:1px solid var(--late-line,#b94f2b)}
.item.b_diff{border-left-color:var(--warn)}
.item.b_moved{border-left-color:var(--late-line,#b94f2b)}
.changes{margin:6px 0 0 27px;font-size:12.5px;color:var(--ink-2)}
.changes b{font-weight:700}
/* すでに入っているもの：数だけ伝える */
.skipped{margin:8px 0 0;font-size:12.5px;color:var(--ink-3)}
.skipped button{font:inherit;font-size:12px;margin-left:6px;padding:2px 8px;cursor:pointer;
 border:1px solid var(--line);border-radius:7px;background:transparent;color:inherit}
.skipped ul{margin:6px 0 0;padding-left:1.1em}
/* 原本サムネイル：確かめているあいだ、ずっと横にある */
.withshot{display:flex;gap:14px;align-items:flex-start}
.withshot .shot{flex:none;width:190px;position:sticky;top:76px}
.withshot .shot img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
.withshot .shot .cap{font-size:11.5px;color:var(--ink-3);margin:5px 0 0}
.withshot .list{flex:1;min-width:0}
@media (max-width:700px){
  .withshot{display:block}
  .withshot .shot{width:100%;position:static;margin:0 0 12px}
  .withshot .shot img{max-height:200px;object-fit:cover;object-position:top}
}
.item .who{font:inherit;font-size:11px;padding:2px 7px;border-radius:2px;border:1px solid var(--line-strong);
 background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.b-dim{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0 0 27px}
@media(min-width:520px){.fields{grid-template-columns:150px 110px 1fr}}
.fields label{font-size:11.5px;color:var(--ink-3);display:block;margin-bottom:3px}
.src{margin:10px 0 0 27px;font-size:12.5px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:10px}
.err{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
  border-radius:4px;padding:12px 14px;font-size:13.5px;margin-top:16px}
.ok{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:4px;padding:12px 14px;font-size:13.5px;margin-top:16px}
.ok a{color:inherit}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);line-height:1.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* だれが つかう？（who.js） */
#who-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--bg,#fff);padding:24px}
#who-box{width:100%;max-width:420px;text-align:center}
#who-q{font-size:20px;font-weight:700;margin:0 0 20px}
#who-list{display:grid;gap:14px}
.who-pick{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;
  border:2px solid var(--who-color);border-radius:16px;background:transparent;
  color:inherit;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-align:left}
.who-pick:hover,.who-pick:focus-visible{background:color-mix(in srgb,var(--who-color) 12%,transparent)}
.who-face{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--who-color);color:#fff;font-size:24px}
@media (prefers-reduced-motion:no-preference){.who-pick{transition:background .15s}}

/* 手で入力する（目標：10タップ・20秒） */
.quick{margin:16px 0 0}
.qtoggle{font:inherit;font-size:13.5px;padding:7px 15px;cursor:pointer;background:var(--surface,#fff);
 color:inherit;border:1px solid var(--line-strong,#c3c8bf);border-radius:999px}
.qbox{margin:10px 0 0;padding:14px;border:1px solid var(--line,#dcded6);border-radius:12px;background:var(--surface,#fff)}
.qbox[hidden]{display:none}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.qrow > .lab{font-size:12.5px;color:var(--ink-3,#7c8783);width:4.4em;flex:none;white-space:nowrap}
.qrow button{font:inherit;font-size:14px;padding:9px 14px;cursor:pointer;background:var(--surface-2,#fbfbf7);
 color:inherit;border:1px solid var(--line-strong,#c3c8bf);border-radius:10px;min-height:42px}
.qrow button[aria-pressed="true"]{background:var(--accent,#0f6b62);color:#fff;border-color:var(--accent,#0f6b62);font-weight:700}
.qrow input[type=text]{flex:1;min-width:170px;font:inherit;font-size:15px;padding:10px 12px;
 color:inherit;background:var(--surface-2,#fbfbf7);border:1px solid var(--line-strong,#c3c8bf);border-radius:10px}
.qrow input[type=date]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-strong,#c3c8bf);
 border-radius:10px;background:var(--surface-2,#fbfbf7);color:inherit}
.qgo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.qgo .add{font:inherit;font-size:15px;font-weight:700;padding:11px 22px;cursor:pointer;min-height:46px;
 background:var(--accent,#0f6b62);color:#fff;border:1px solid var(--accent,#0f6b62);border-radius:10px}
.qgo .same{font:inherit;font-size:14px;padding:10px 16px;cursor:pointer;min-height:44px;
 background:var(--surface-2,#fbfbf7);color:inherit;border:1px solid var(--line-strong,#c3c8bf);border-radius:10px}
.qgo button:disabled{opacity:.45;cursor:default}
.qnote{font-size:13px;color:var(--ink-3,#7c8783);border:0;background:none;padding:0}
.qnote.ok{color:var(--accent,#0f6b62);font-weight:700}
</style>
</head>
<body>
<header><div class="hdr">
  <h1>みまもりくん</h1>
  <span class="tag">SCHOOL NOTICE → CALENDAR</span>
  <nav class="nav" aria-label="画面を切り替える">
    <a href="/" class="on" aria-current="page">撮る</a>
    <a href="/board">一覧</a>
      <a href="/schedule">予定表</a>
      <a href="/plan">計画</a>
    <a href="/kid">やりとり</a>
    <a href="/reward">ごほうび</a>
    <button class="theme" id="theme" type="button">☾ 暗く</button>
  </nav>
</div></header>

<div class="wrap">
  <p class="lead">ランドセルから出てきたプリントを撮るだけ。日付・持ち物・提出期限を読み取って、
  重複を確かめてから Google カレンダーに並べます。<strong>登録はあなたが確認してから。</strong></p>

  <div class="panel">
    <label class="file" for="file">
      <span class="big">📷 おたよりを撮る / 選ぶ</span>
      <span class="sm">プリント、連絡帳、学校アプリのスクリーンショット</span>
      <input type="file" id="file" accept="image/*" capture="environment">
    </label>
    <img id="preview" alt="選択したおたより">
    <div class="hintwrap">
      <label for="hint">補足メモ（任意）</label>
      <input type="text" id="hint" placeholder="例：下の子のぶん / 4月に配られた古いプリント">
    </div>
    <div class="row">
      <button class="btn primary" id="go" disabled>読み取る</button>
      <span id="note" class="tag"></span>
    </div>
  </div>

  <div class="quick">
    <button type="button" class="qtoggle" id="qtoggle" aria-expanded="false">✍️ 手で入力する（パソコンを開けなかった日）</button>
    <div class="qbox" id="qbox" hidden>
      <div class="qrow" id="qchild"><span class="lab">だれ</span></div>
      <div class="qrow" id="qsubj"><span class="lab">きょうか</span></div>
      <div class="qrow" id="qwhen"><span class="lab">いつ</span>
        <button type="button" data-o="0" aria-pressed="true">きょう</button>
        <button type="button" data-o="1" aria-pressed="false">あした</button>
        <button type="button" data-o="2" aria-pressed="false">あさって</button>
        <input type="date" id="qdate" aria-label="日付を選ぶ">
      </div>
      <div class="qrow" id="qkind"><span class="lab">なに</span>
        <button type="button" data-k="homework" aria-pressed="true">しゅくだい</button>
        <button type="button" data-k="deadline" aria-pressed="false">ていしゅつ</button>
        <button type="button" data-k="bring" aria-pressed="false">もちもの</button>
      </div>
      <div class="qrow"><span class="lab">やること</span>
        <input type="text" id="qtitle" placeholder="例：ドリル p.12（空でもOK）" enterkeyhint="done">
      </div>
      <div class="qgo">
        <button type="button" class="add" id="qadd">追加する</button>
        <button type="button" class="same" id="qsame">昨日と同じ</button>
        <span class="qnote" id="qnote"></span>
      </div>
    </div>
  </div>

  <div id="result"></div>

  <footer id="meta"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
let picked = null, extraction = null;

fetch("/api/config").then(r=>r.json()).then(c=>{
  window.CHILDREN = (c.children||[]).map(x=>x.name);
  qSetup(c.children);
  $("#meta").innerHTML =
    "CALENDAR  " + esc(c.calendar_id) + "<br>" +
    "MODEL     " + esc(c.model) + "<br>" +
    "AGENT SA  " + esc(c.service_account) + "<br>" +
    "CHILDREN  " + c.children.map(x=>esc(x.name)+"/"+esc(x.school_level)).join("  ");
}).catch(()=>{});

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

$("#file").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  picked = f;
  const img = $("#preview");
  img.src = URL.createObjectURL(f);
  img.style.display = "block";
  $("#go").disabled = false;
  $("#note").textContent = f.name;
});

$("#go").addEventListener("click", async () => {
  if(!picked) return;
  $("#go").disabled = true;
  $("#note").innerHTML = '<span class="spinner"></span> 読み取り中（カレンダー照会を含むので20秒ほど）';
  $("#result").innerHTML = "";
  const fd = new FormData();
  fd.append("image", picked);
  fd.append("hint", $("#hint").value);
  try{
    const res = await fetch("/api/extract", {method:"POST", body:fd});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "読み取りに失敗しました");
    extraction = data;
    render(data);
    $("#note").textContent = "";
  }catch(err){
    $("#result").innerHTML = '<div class="err">' + esc(err.message) +
      ' <button type="button" class="qtoggle" id="qfall">手で入力する</button></div>';
    $("#qfall").addEventListener("click", () => {
      $("#qbox").hidden = false;
      $("#qtoggle").setAttribute("aria-expanded", "true");
      $("#qbox").scrollIntoView({block: "center"});
      $("#qtitle").focus();
    });
    $("#note").textContent = "";
  }
  $("#go").disabled = false;
});

function render(d){
  const KIND = {event:"行事", deadline:"提出期限", homework:"宿題", bring:"持ち物"};
  const BR = {new:"b-new", diff:"b-diff", moved:"b-moved"};
  let h = "<h2>登録候補</h2>";
  h += '<p class="summary">' + esc(d.summary) + "</p>";

  // すでに入っているものは**候補に出さない**（D-33）。毎回承認させると、承認が面倒になる。
  if(d.skipped){
    h += '<p class="skipped">すでに入っているもの ' + d.skipped + "件は、そのままにしました。"
       + '<button type="button" id="showskip">見る</button>'
       + '<span id="skiplist"></span></p>';
  }
  if(d.trace && d.trace.length){
    h += '<div class="trace">' + d.trace.map(t=>"<div>› "+esc(t)+"</div>").join("") + "</div>";
  }
  if(!d.items.length){
    h += '<div class="ok">新しく入れるものはありませんでした。</div>';
    $("#result").innerHTML = h;
    if(d.skipped) bindSkip(d);
    return;
  }

  // 原本を横に置いたまま確かめる（画面設計 12-1）。撮り直さないと確かめられない、をなくす。
  h += '<div class="withshot"><div class="shot">'
     + (picked ? '<img id="shot" src="'+URL.createObjectURL(picked)+'" alt="撮ったもの">' : "")
     + '<p class="cap">撮ったもの</p></div><div class="list"><div class="items">';

  d.items.forEach(it => {
    const br = it.branch || "new";
    const cls = (br==="diff" ? "b_diff" : br==="moved" ? "b_moved" : "") + (it.needs_review ? " review" : "");
    h += '<div class="item ' + cls + '" data-id="' + it.id + '">'
      + '<div class="item-head">'
        + '<input type="checkbox" data-f="selected"' + (it.selected ? " checked" : "") + ' aria-label="登録する">'
        + '<input class="item-title" data-f="title" value="' + esc(it.title) + '">'
      + "</div>"
      + '<div class="badges">'
        + '<span class="badge ' + (BR[br]||"b-dim") + '">' + esc(it.branch_label || "新規") + "</span>"
        + '<span class="badge b-kind">' + esc(KIND[it.kind] || it.kind) + "</span>"
        + '<button type="button" class="who" data-f="child">' + esc(it.child || "不明") + "</button>"
        + (it.needs_review ? '<span class="badge b-warn">要確認</span>' : "")
        + '<span class="badge b-dim">確度 ' + Math.round((it.confidence||0)*100) + "%</span>"
      + "</div>"
      + (br==="moved"
          ? '<div class="changes">前は <b>' + esc(it.matched_date||"") + '</b> に入っています（' + esc(it.duplicate_of||"") + "）</div>"
          : "")
      + ((it.changes && it.changes.length)
          ? '<div class="changes">' + it.changes.map(c=>"・"+esc(c)).join("<br>") + "</div>"
          : "")
      + '<div class="fields">'
        + '<div><label>日付</label><input type="date" data-f="date" value="' + esc(it.date) + '"></div>'
        + '<div><label>開始時刻</label><input type="text" data-f="time_start" placeholder="終日" value="' + esc(it.time_start||"") + '"></div>'
        + '<div><label>持ち物・補足</label><input type="text" data-f="note" value="' + esc([...(it.bring||[]), it.note].filter(Boolean).join(" / ")) + '"></div>'
      + "</div>"
      + (it.source_text ? '<div class="src">' + esc(it.source_text) + "</div>" : "")
    + "</div>";
  });
  h += "</div>";
  h += '<div class="row"><button class="btn primary" id="reg">カレンダーに登録する</button>'
     + '<button class="btn ghost" id="all">全部チェック</button><span id="regnote" class="tag"></span></div>';
  h += "</div></div>";
  $("#result").innerHTML = h;

  if(d.skipped) bindSkip(d);
  $("#all").addEventListener("click", () => {
    document.querySelectorAll('.item input[data-f="selected"]').forEach(c => c.checked = true);
  });
  $("#reg").addEventListener("click", doRegister);

  // どの子かは**推定値を出しておいて、1タップで変える**（FR-2.2）
  document.querySelectorAll('.item .who').forEach(btn => {
    btn.addEventListener("click", () => {
      const names = (window.CHILDREN || []).concat(["不明"]);
      const i = names.indexOf(btn.textContent.trim());
      btn.textContent = names[(i + 1) % names.length];
    });
  });
}

function bindSkip(d){
  const b = document.getElementById("showskip");
  if(!b) return;
  b.addEventListener("click", () => {
    const box = document.getElementById("skiplist");
    if(box.innerHTML){ box.innerHTML = ""; b.textContent = "見る"; return; }
    box.innerHTML = "<ul>" + (d.skipped_titles||[]).map(t=>"<li>"+esc(t)+"</li>").join("") + "</ul>";
    b.textContent = "閉じる";
  });
}

// 10分だけ「取り消す」を出しておく。押し忘れたまま残り続けるより、消えたほうがいい。
function armUndo(ids){
  const btn = document.getElementById("undo");
  if(!btn) return;
  const until = Date.now() + 10*60*1000;
  const tick = setInterval(() => {
    const left = Math.max(0, Math.round((until - Date.now())/1000));
    if(left <= 0){ clearInterval(tick); btn.remove(); document.getElementById("undonote").textContent=""; return; }
    document.getElementById("undonote").textContent = "あと" + Math.ceil(left/60) + "分";
  }, 1000);
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    document.getElementById("undonote").textContent = "取り消しています…";
    try{
      const res = await fetch("/api/register/undo", {method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify({ids})});
      const j = await res.json();
      if(!res.ok) throw new Error(j.detail || "取り消せませんでした");
      clearInterval(tick);
      document.getElementById("regdone").innerHTML =
        j.undone + " 件を取り消しました。カレンダーには記録として残ります。";
    }catch(err){
      btn.disabled = false;
      document.getElementById("undonote").textContent = err.message;
    }
  });
}

function collect(){
  const out = [];
  document.querySelectorAll(".item").forEach(el => {
    const src = extraction.items.find(x => x.id === el.dataset.id);
    if(!el.querySelector('[data-f="selected"]').checked) return;
    const note = el.querySelector('[data-f="note"]').value;
    const who = el.querySelector('[data-f="child"]');
    out.push(Object.assign({}, src, {
      child: who ? who.textContent.trim() : src.child,
      title: el.querySelector('[data-f="title"]').value,
      date: el.querySelector('[data-f="date"]').value,
      time_start: el.querySelector('[data-f="time_start"]').value || null,
      bring: [],
      note: note
    }));
  });
  return out;
}

async function doRegister(){
  const items = collect();
  if(!items.length){ $("#regnote").textContent = "チェックが入っていません"; return; }
  $("#reg").disabled = true;
  $("#regnote").innerHTML = '<span class="spinner"></span> 登録中';
  try{
    const res = await fetch("/api/register", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({items})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "登録に失敗しました");
    const ok = data.results.filter(r=>r.status==="ok");
    const ng = data.results.filter(r=>r.status!=="ok");
    // まとめて入れたものは、まとめて取り消せる（10分間・D-3）
    const ids = ok.map(r=>r.id).filter(Boolean);
    let h = '<div class="ok" id="regdone">' + ok.length + " 件をカレンダーに登録しました。"
          + (ids.length ? ' <button type="button" class="btn ghost" id="undo">取り消す</button>'
                          + '<span class="tag" id="undonote"></span>' : "")
          + "<br>"
          + ok.map(r=>'・<a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.title)+"</a>").join("<br>")
          + "</div>";
    if(ng.length) h += '<div class="err">' + ng.length + " 件が失敗しました。<br>"
          + ng.map(r=>"・"+esc(r.title)+" — "+esc(r.error)).join("<br>") + "</div>";
    $("#regnote").textContent = "";
    $("#result").insertAdjacentHTML("beforeend", h);
    if(ids.length) armUndo(ids);
  }catch(err){
    $("#regnote").textContent = "";
    $("#result").insertAdjacentHTML("beforeend", '<div class="err">'+esc(err.message)+"</div>");
  }
  $("#reg").disabled = false;
}

// ---- 手で入力する ---------------------------------------------------------
// 学校のパソコンを開けない日がある。そこで止まると習慣が切れる（NF-O1）。
// **タイトル1行以外はすべてボタン**にして、5タップで1件入る形にする。
const QSUBJ = {
  elementary: ["こくご", "さんすう", "えいご", "せいかつ", "その他"],
  junior_high: ["国語", "数学", "英語", "社会", "理科", "その他"],
  unknown: ["国語", "算数", "英語", "その他"],
};
let qChildren = [], qSubj = "", qChild = "", qOffset = 0, qKind = "homework", qDate = "";

function qPress(row, el){
  row.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === el)));
}
function qDateISO(){
  if (qDate) return qDate;
  const d = new Date(); d.setDate(d.getDate() + qOffset);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function qLevel(name){
  const c = qChildren.find(x => x.name === name);
  return (c && c.school_level) || "unknown";
}
function qRenderSubjects(){
  const list = QSUBJ[qLevel(qChild)] || QSUBJ.unknown;
  if (!list.includes(qSubj)) qSubj = list[0];
  $("#qsubj").innerHTML = '<span class="lab">きょうか</span>' + list.map(x =>
    '<button type="button" data-s="' + esc(x) + '" aria-pressed="' + (x === qSubj) + '">' + esc(x) + "</button>").join("");
}
function qSetup(children){
  qChildren = children || [];
  qChild = (localStorage.getItem("mimamori-child") || (qChildren[0] && qChildren[0].name) || "");
  if (!qChildren.some(c => c.name === qChild)) qChild = (qChildren[0] && qChildren[0].name) || "";
  $("#qchild").innerHTML = '<span class="lab">だれ</span>' + qChildren.map(c =>
    '<button type="button" data-c="' + esc(c.name) + '" aria-pressed="' + (c.name === qChild) + '">' + esc(c.name) + "</button>").join("");
  qRenderSubjects();
}

$("#qtoggle").addEventListener("click", () => {
  const box = $("#qbox"), open = box.hidden;
  box.hidden = !open;
  $("#qtoggle").setAttribute("aria-expanded", String(open));
});
$("#qsubj").addEventListener("click", e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  qSubj = b.dataset.s; qPress($("#qsubj"), b);
});
$("#qchild").addEventListener("click", e => {
  const b = e.target.closest("button[data-c]"); if (!b) return;
  qChild = b.dataset.c; qPress($("#qchild"), b);
  try { localStorage.setItem("mimamori-child", qChild); } catch (err) {}
  qRenderSubjects();
});
$("#qwhen").addEventListener("click", e => {
  const b = e.target.closest("button[data-o]"); if (!b) return;
  qOffset = +b.dataset.o; qDate = ""; $("#qdate").value = ""; qPress($("#qwhen"), b);
});
$("#qdate").addEventListener("change", e => {
  qDate = e.target.value;
  $("#qwhen").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false"));
});
$("#qkind").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  qKind = b.dataset.k; qPress($("#qkind"), b);
});

async function qPost(items){
  const res = await fetch("/api/register", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({items: items, pending: false})
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.detail || "登録できませんでした");
  return j;
}

$("#qadd").addEventListener("click", async () => {
  if (!qChild) { $("#qnote").textContent = "だれのぶんか選んでください"; return; }
  const extra = $("#qtitle").value.trim();
  // やることが空でも入る。「算数の宿題」だけで足りる日がある。
  const title = qChild + "｜" + qSubj + (extra ? " " + extra : "");
  const btn = $("#qadd"); btn.disabled = true; $("#qnote").textContent = "入れています…";
  try {
    await qPost([{title: title, child: qChild, kind: qKind, date: qDateISO(), note: "手で入力"}]);
    $("#qnote").className = "qnote ok";
    $("#qnote").textContent = "入れました：" + title.split("｜")[1];
    $("#qtitle").value = "";            // 続けて打てるように、教科と日付は残す
  } catch (err) {
    $("#qnote").className = "qnote"; $("#qnote").textContent = err.message;
  }
  btn.disabled = false;
});

$("#qsame").addEventListener("click", async () => {
  if (!qChild) { $("#qnote").textContent = "だれのぶんか選んでください"; return; }
  const btn = $("#qsame"); btn.disabled = true; $("#qnote").className = "qnote";
  $("#qnote").textContent = "昨日のぶんを見ています…";
  try {
    const res = await fetch("/api/quick/repeat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({child: qChild})
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.detail || "できませんでした");
    if (j.created.length) {
      $("#qnote").className = "qnote ok";
      $("#qnote").textContent = j.created.length + "件 入れました：" +
        j.created.map(t => t.split("｜")[1]).join("、");
    } else {
      $("#qnote").textContent = j.note || "入れるものがありませんでした";
    }
  } catch (err) { $("#qnote").textContent = err.message; }
  btn.disabled = false;
});
</script>
