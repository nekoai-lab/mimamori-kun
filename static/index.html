<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みまもりくん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/appearance.css">
<script src="/static/who.js" defer></script>
<style>
:root{
  --paper:#F6F6F1;--surface:#fff;--surface-2:#FBFBF7;
  --ink:#191C1B;--ink-2:#4A524F;--ink-3:#7C8783;
  --line:#DCDED6;--line-strong:#C3C8BF;
  --accent:#0F6B62;--accent-soft:#E2F0ED;
  --warn:#B94F2B;--warn-soft:#F7E7DF;
  --shadow:0 1px 2px rgba(25,28,27,.05),0 8px 24px -16px rgba(25,28,27,.25);
}
:root[data-theme="dark"]{
  --paper:#101413;--surface:#191E1D;--surface-2:#151A19;
  --ink:#ECEFEB;--ink-2:#AFB9B5;--ink-3:#7E8A86;
  --line:#2A3231;--line-strong:#3A4442;
  --accent:#5FCFC0;--accent-soft:#14302C;
  --warn:#E8926B;--warn-soft:#33211A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 80px}
header{border-bottom:1px solid var(--line);margin-bottom:24px;background:var(--paper)}
.hdr{max-width:720px;margin:0 auto;padding:16px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:inherit;font-size:21px;margin:0}
.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.nav{flex-basis:100%;display:flex;gap:6px;overflow-x:auto}
.nav a{flex:none;font-size:12.5px;text-decoration:none;padding:4px 12px;white-space:nowrap;
  border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-2)}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.theme{margin-left:auto;flex:none;font:inherit;font-size:12.5px;padding:4px 12px;white-space:nowrap;
  border:1px solid var(--line-strong);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer}
.lead{color:var(--ink-2);font-size:14px;margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:18px}
label.file{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:2px dashed var(--line-strong);border-radius:5px;padding:32px 18px;cursor:pointer;
  background:var(--surface-2);text-align:center;transition:border-color .15s,background .15s}
label.file:hover,label.file:focus-within{border-color:var(--accent);background:var(--accent-soft)}
label.file .big{font-size:15px;font-weight:700}
label.file .sm{font-size:12.5px;color:var(--ink-3)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#preview{display:none;margin-top:14px;border:1px solid var(--line);border-radius:4px;max-width:100%}
.hintwrap{margin-top:14px}
.hintwrap label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:3px;padding:8px 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:700;font-size:14.5px;border-radius:4px;padding:12px 22px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.spinner{width:15px;height:15px;border:2px solid var(--accent-soft);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-family:inherit;font-size:19px;margin:32px 0 6px}
.summary{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.trace{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:16px}
.trace div+div{margin-top:3px}
.items{display:flex;flex-direction:column;gap:12px}
.item{min-width:0;margin-inline:0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 4px 4px 0;box-shadow:var(--shadow);padding:14px}
.item.dup{border-left-color:var(--line-strong);opacity:.72}
.item.review{border-left-color:var(--warn)}
.item-head{display:flex;gap:10px;align-items:flex-start}
.item-head input[type=checkbox]{margin-top:6px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.item-title{flex:1;font-weight:700;font-size:15px;border:0;background:transparent;padding:2px 0;color:var(--ink)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 27px}
.badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:2px}
.b-kind{background:var(--accent-soft);color:var(--accent)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
/* 4分岐のバッジ（D-1） */
.b-new{background:var(--accent);color:#fff}
.b-diff{background:var(--warn-soft);color:var(--warn)}
.b-moved{background:var(--late,#b3402015);color:var(--late-ink,#963c1e);border:1px solid var(--late-line,#b94f2b)}
.item.b_diff{border-left-color:var(--warn)}
.item.b_moved{border-left-color:var(--late-line,#b94f2b)}
.changes{margin:6px 0 0 27px;font-size:12.5px;color:var(--ink-2)}
.changes b{font-weight:700}
/* すでに入っているもの：数だけ伝える */
.skipped{margin:8px 0 0;font-size:12.5px;color:var(--ink-3)}
.skipped button{font:inherit;font-size:12px;margin-left:6px;padding:2px 8px;cursor:pointer;
 border:1px solid var(--line);border-radius:7px;background:transparent;color:inherit}
.skipped ul{margin:6px 0 0;padding-left:1.1em}
/* 原本サムネイル：確かめているあいだ、ずっと横にある */
.withshot{display:flex;gap:14px;align-items:flex-start}
.withshot .shot{flex:none;width:190px;position:sticky;top:76px}
.withshot .shot img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in}
.withshot .shot .cap{font-size:11.5px;color:var(--ink-3);margin:5px 0 0}
.withshot .list{flex:1;min-width:0}
@media (max-width:700px){
  .withshot{display:block}
  .withshot .shot{width:100%;position:static;margin:0 0 12px}
  .withshot .shot img{max-height:200px;object-fit:cover;object-position:top}
}
.item .who{font:inherit;font-size:11px;padding:2px 7px;border-radius:2px;border:1px solid var(--line-strong);
 background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.b-dim{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0 0 27px}
@media(min-width:520px){.fields{grid-template-columns:150px 110px 1fr}}
.fields label{font-size:11.5px;color:var(--ink-3);display:block;margin-bottom:3px}
.src{margin:10px 0 0 27px;font-size:12.5px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:10px}
.err{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
  border-radius:4px;padding:12px 14px;font-size:13.5px;margin-top:16px}
.ok{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);
  border-radius:4px;padding:12px 14px;font-size:13.5px;margin-top:16px}
.ok a{color:inherit}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);line-height:1.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* だれが つかう？（who.js） */
#who-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--bg,#fff);padding:24px}
#who-box{width:100%;max-width:420px;text-align:center}
#who-q{font-size:20px;font-weight:700;margin:0 0 20px}
#who-list{display:grid;gap:14px}
.who-pick{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;
  border:2px solid var(--who-color);border-radius:16px;background:transparent;
  color:inherit;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-align:left}
.who-pick:hover,.who-pick:focus-visible{background:color-mix(in srgb,var(--who-color) 12%,transparent)}
.who-face{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--who-color);color:#fff;font-size:24px}
@media (prefers-reduced-motion:no-preference){.who-pick{transition:background .15s}}

/* 手で入力する（目標：10タップ・20秒） */
.quick{margin:16px 0 0}
.qtoggle{font:inherit;font-size:13.5px;padding:7px 15px;cursor:pointer;background:var(--surface,#fff);
 color:inherit;border:1px solid var(--line-strong,#c3c8bf);border-radius:999px}
.qbox{margin:10px 0 0;padding:14px;border:1px solid var(--line,#dcded6);border-radius:12px;background:var(--surface,#fff)}
.qbox[hidden]{display:none}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.qrow > .lab{font-size:12.5px;color:var(--ink-3,#7c8783);width:4.4em;flex:none;white-space:nowrap}
.qrow button{font:inherit;font-size:14px;padding:9px 14px;cursor:pointer;background:var(--surface-2,#fbfbf7);
 color:inherit;border:1px solid var(--line-strong,#c3c8bf);border-radius:10px;min-height:42px}
.qrow button[aria-pressed="true"]{background:var(--accent,#0f6b62);color:#fff;border-color:var(--accent,#0f6b62);font-weight:700}
.qrow input[type=text]{flex:1;min-width:170px;font:inherit;font-size:15px;padding:10px 12px;
 color:inherit;background:var(--surface-2,#fbfbf7);border:1px solid var(--line-strong,#c3c8bf);border-radius:10px}
.qrow input[type=date]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-strong,#c3c8bf);
 border-radius:10px;background:var(--surface-2,#fbfbf7);color:inherit}
.qgo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.qgo .add{font:inherit;font-size:15px;font-weight:700;padding:11px 22px;cursor:pointer;min-height:46px;
 background:var(--accent,#0f6b62);color:#fff;border:1px solid var(--accent,#0f6b62);border-radius:10px}
.qgo .same{font:inherit;font-size:14px;padding:10px 16px;cursor:pointer;min-height:44px;
 background:var(--surface-2,#fbfbf7);color:inherit;border:1px solid var(--line-strong,#c3c8bf);border-radius:10px}
.qgo button:disabled{opacity:.45;cursor:default}
.qnote{font-size:13px;color:var(--ink-3,#7c8783);border:0;background:none;padding:0}
.qnote.ok{color:var(--accent,#0f6b62);font-weight:700}
[hidden]{display:none!important}
body:not([data-audience="parent"]) .parent-only{display:none!important}
.photo-choice{display:inline-block;margin-top:12px;position:relative}
label.file{position:relative}
label.file:has(input:disabled),.photo-choice:has(input:disabled){opacity:.5;cursor:wait}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.item-title{min-width:0}
.fields input{max-width:100%;min-width:0}
.owner-choice{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.owner-choice button{min-height:48px}
#capture-title{margin-top:0}
#preview{max-height:320px;object-fit:contain}
#photo-dialog{max-width:95vw;max-height:95vh;background:var(--surface);color:var(--ink)}
#photo-dialog img{display:block;max-width:100%;max-height:75vh;object-fit:contain}
</style>
</head>
<body data-audience="pending">
<header><div class="hdr">
  <h1>みまもりくん</h1>
  <span id="audience">確認中</span>
  <span data-profile-menu></span><span data-appearance-picker></span>
  <select id="child" aria-label="だれのプリントか" hidden></select>
  <nav data-family-nav class="nav" aria-label="画面を切り替える">
    <a href="/" class="on" aria-current="page">撮る</a>
    <a class="parent-only" href="/board">一覧</a>
      <a class="parent-only" href="/schedule">予定表</a>
      <a class="parent-only" href="/plan">計画</a>
    <a href="/kid">きょう</a>
    <a href="/reward">ごほうび</a>
    <button class="theme" id="theme" type="button">☾ 暗く</button>
  </nav>
</div></header>

<div class="wrap">
  <h2 id="capture-title">だれが使っているか確かめています</h2>
  <p class="lead" id="capture-lead">確認できるまで待ってね。</p>
  <p id="identity-note" role="status"></p>
  <button type="button" class="btn ghost" id="identity-retry" hidden>もう一度確かめる</button>

  <div class="panel">
    <label class="file" for="file">
      <span class="big" id="camera-label">📷 撮る／ファイルを選ぶ</span>
      <span class="sm">プリント、連絡帳、学校アプリのスクリーンショット</span>
      <input type="file" id="file" disabled accept="image/*" capture="environment">
    </label>
    <label class="btn ghost photo-choice" for="album"><span id="album-label">写真を選ぶ</span>
      <input type="file" id="album" disabled accept="image/*">
    </label>
    <p class="summary">カメラが使えないときは、写真を選ぶか、手でいれられます。</p>
    <img id="preview" alt="選択したおたより">
    <details class="hintwrap parent-only"><summary>補足を加える</summary>
      <label for="hint">補足メモ（任意）</label>
      <input type="text" id="hint" placeholder="例：下の子のぶん / 4月に配られた古いプリント">
    </details>
    <div class="row">
      <button class="btn primary" id="go" disabled>読み取る</button>
      <span id="note" role="status" aria-live="polite"></span>
    </div>
  </div>

  <div class="quick">
    <button type="button" class="qtoggle" id="qtoggle" aria-expanded="false">手で入力する</button>
    <div class="qbox" id="qbox" hidden>
      <div class="qrow" id="qchild"><span class="lab">だれ</span></div>
      <div class="qrow" id="qsubj"><span class="lab">きょうか</span></div>
      <div class="qrow" id="qwhen"><span class="lab">いつ</span>
        <button type="button" data-o="0" aria-pressed="true">きょう</button>
        <button type="button" data-o="1" aria-pressed="false">あした</button>
        <button type="button" data-o="2" aria-pressed="false">あさって</button>
        <input type="date" id="qdate" aria-label="日付を選ぶ">
      </div>
      <div class="qrow" id="qkind"><span class="lab">なに</span>
        <button type="button" data-k="homework" aria-pressed="true">しゅくだい</button>
        <button type="button" data-k="deadline" aria-pressed="false">ていしゅつ</button>
        <button type="button" data-k="bring" aria-pressed="false">もちもの</button>
      </div>
      <div class="qrow"><label class="lab" for="qtitle">やること</label>
        <input type="text" id="qtitle" placeholder="例：ドリル p.12（空でもOK）" enterkeyhint="done">
      </div>
      <div class="qgo">
        <button type="button" class="add" id="qadd" disabled>追加する</button>
        <button type="button" class="same" id="qsame" disabled>昨日と同じ</button>
        <span class="qnote" id="qnote"></span>
      </div>
    </div>
  </div>

  <div id="result" tabindex="-1" role="region" aria-label="読み取り結果" aria-live="polite"></div>
  <div id="completion" tabindex="-1" role="region" aria-label="登録結果" aria-live="polite"></div>
  <p><a id="return-link" href="/board">一覧で確認する</a></p>

  <footer id="meta" class="parent-only"></footer>
</div>

<dialog id="photo-dialog" aria-label="撮ったものを拡大">
  <form method="dialog"><button class="btn ghost">閉じる</button></form>
  <img id="photo-large" alt="撮ったものの原本">
</dialog>
<script>
const $ = s => document.querySelector(s);
let picked = null, extraction = null, previewURL = "";
let audience = "pending", currentChild = "", generation = 0, busy = false;
let photoConsumed = false, manualLocked = false, undoTick = null;
const isKid = () => audience === "kid";
const current = token => token === generation;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// URL や保存された表示モードはログインの役割を上書きしない。
let identityLoading = false, configReady = false;
const identityStarted = Date.now();
const canAct = () => (audience === "kid" || audience === "parent") && configReady && !!currentChild;
async function confirmIdentity(){
  if(identityLoading) return;
  identityLoading = true;
  audience = "pending";
  document.body.dataset.audience = audience;
  $("#audience").textContent = "確認中";
  $("#identity-note").textContent = "だれが使っているか確かめています。";
  $("#identity-retry").hidden = true;
  controls();
  try{
    const res = await fetch("/api/auth/me");
    if(!res.ok) throw new Error();
    const me = await res.json();
    if(!me || !["child", "parent"].includes(me.role)) throw new Error();
    audience = me.role === "child" ? "kid" : "parent";
  }catch(err){
    audience = "unknown";
    document.body.dataset.audience = audience;
    $("#audience").textContent = "確認できません";
    $("#capture-title").textContent = "だれが使っているか確認できませんでした";
    $("#capture-lead").textContent = "もう一度確かめてから、撮影・登録してね。";
    $("#identity-note").textContent = "だれかを確かめられなかったよ。";
    $("#identity-retry").hidden = false;
    identityLoading = false;
    controls();
    return;
  }
  document.documentElement.dataset.audience = audience;
  document.body.dataset.audience = audience;
  $("#audience").textContent = isKid() ? "こども" : "おうちの人";
  $("#capture-title").textContent = isKid() ? "プリントを とろう" : "おたよりを取り込む";
  $("#capture-lead").textContent = isKid() ? "とったら、やることに 入るよ" : "読み取った内容を確認して、登録します。";
  $("#camera-label").textContent = isKid() ? "📷 しゃしんを とる" : "📷 撮る／ファイルを選ぶ";
  $("#album-label").textContent = isKid() ? "しゃしんを えらぶ" : "写真を選ぶ";
  $("#qtoggle").textContent = isKid() ? "手でいれる" : "手で入力する";
  $("#qsame").textContent = isKid() ? "きのうと おなじ" : "昨日と同じ";
  $("#return-link").href = isKid() ? "/kid" : "/board";
  $("#return-link").textContent = isKid() ? "きょうを みる" : "一覧で確認する";
  try{
    if(!configReady){
      const res = await fetch("/api/config");
      if(!res.ok) throw new Error();
      const c = await res.json();
      if(!Array.isArray(c.children) || !c.children.length) throw new Error();
      qSetup(c.children);
      window.CHILDREN = qChildren.map(x => x.name);
      $("#child").innerHTML = qChildren.map(x => '<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join("");
      configReady = true;
      if(!currentChild && Date.now() - identityStarted >= 15000){
        $("#child").insertAdjacentHTML("afterbegin", '<option value="">だれのプリントか選んでね</option>');
        $("#child").value = "";
        $("#child").hidden = false;
      }
    }
    $("#identity-note").textContent = "";
  }catch(err){
    $("#identity-note").textContent = "設定を読み込めませんでした。もう一度確かめてね。";
    $("#identity-retry").hidden = false;
  }finally{
    identityLoading = false;
    controls();
  }
}
$("#identity-retry").addEventListener("click", confirmIdentity);

function controls(){
  $("#file").disabled = busy || !canAct();
  $("#album").disabled = busy || !canAct();
  $("#go").disabled = busy || !picked || !canAct() || photoConsumed;
  $("#qadd").disabled = busy || !canAct() || manualLocked;
  $("#qsame").disabled = busy || !canAct() || manualLocked;
}
function selectedChild(){
  const child = $("#child").value;
  if(!child || child === currentChild) return;
  currentChild = child; qChild = child; generation++;
  busy = false; photoConsumed = false; manualLocked = false;
  extraction = null; picked = null;
  if(previewURL) URL.revokeObjectURL(previewURL);
  previewURL = "";
  $("#preview").removeAttribute("src"); $("#preview").style.display = "none";
  $("#file").value = ""; $("#album").value = "";
  $("#hint").value = ""; $("#qtitle").value = "";
  $("#qnote").textContent = ""; $("#note").textContent = "";
  $("#result").innerHTML = ""; $("#completion").innerHTML = "";
  clearInterval(undoTick);
  $("#qchild").textContent = "だれ：" + child;
  qRenderSubjects(); controls();
  // 共通基盤が未導入でもこの画面の業務処理は動く。
  try {
    if(window.Appearance && typeof window.Appearance.setChild === "function") {
      Promise.resolve(window.Appearance.setChild(child)).catch(() => {});
    }
  } catch(err) { /* 見た目の失敗で撮影を止めない */ }
}
$("#child").addEventListener("who:ready", selectedChild);
$("#child").addEventListener("change", selectedChild);

function exits(){
  return '<p><a class="btn primary" href="'+(isKid() ? '/kid' : '/board')+'">'+(isKid() ? 'きょうを みる' : '一覧で確認する')+'</a></p>';
}
function openManual(){
  $("#qbox").hidden = false; $("#qtoggle").setAttribute("aria-expanded", "true");
  $("#qtitle").focus();
}
function revealResult(origin, selector){
  // 別の操作に移った人からフォーカスを奪わない。
  if(document.activeElement !== origin && document.activeElement !== document.body) return;
  const target = selector ? $(selector) : ($("#completion").innerHTML ? $("#completion") : $("#result"));
  if(!target.innerHTML) return;
  target.focus({preventScroll:true});
  target.scrollIntoView({block:"start", behavior:"instant"});
}
function readFailure(){
  $("#result").innerHTML = '<div class="err">うまく読めなかったよ。文字がはっきり写っているか見てね。'
    + '<div class="row"><button class="btn ghost" id="retake">とりなおす</button>'
    + '<button class="btn ghost" id="qfall">手でいれる</button></div></div>';
  $("#retake").addEventListener("click", () => $("#file").click());
  $("#qfall").addEventListener("click", openManual);
}
async function choosePhoto(e){
  if(busy || !canAct()) return;
  const f = e.target.files[0];
  if(!f){ $("#note").textContent = "写真を選ぶか、手でいれられます。"; return; }
  if(f.type && !f.type.startsWith("image/")){ readFailure(); revealResult(document.activeElement); return; }
  extraction = null; photoConsumed = false;
  picked = f;
  if(previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(f);
  $("#preview").src = previewURL; $("#preview").style.display = "block";
  $("#result").innerHTML = "";
  $("#note").textContent = "写真を選びました。まだ送っていません。";
  controls();
  if(isKid()) await readPhoto();
}
for(const id of ["#file", "#album"]){
  $(id).addEventListener("change", choosePhoto);
  $(id).addEventListener("cancel", () => { $("#note").textContent = "写真を選ぶか、手でいれられます。"; });
}
$("#go").addEventListener("click", readPhoto);
async function readPhoto(){
  if(!canAct() || !picked || busy || photoConsumed) return;
  if(navigator.onLine === false){
    $("#note").textContent = "つながったら、よみとろう。写真はこのページにだけ残ります。閉じると失われます。";
    return;
  }
  const token = generation, origin = document.activeElement;
  $("#completion").innerHTML = "";
  busy = true; controls();
  $("#note").textContent = "写真を送る準備をしているよ";
  $("#result").innerHTML = "";
  const fd = new FormData(); fd.append("image", picked);
  fd.append("hint", isKid() ? "" : $("#hint").value);
  const timer = setTimeout(() => { if(current(token)) $("#note").textContent = "もう少しかかっているよ"; }, 15000);
  try{
    $("#note").textContent = "よみとっているよ";
    const res = await fetch("/api/extract", {method:"POST", body:fd});
    const data = await res.json();
    if(!current(token)) return;
    if(!res.ok || !Array.isArray(data.items)) throw new Error();
    clearTimeout(timer); $("#note").textContent = "";
    extraction = data;
    if(isKid()) await kidCandidates(data, token);
    else render(data);
  }catch(err){ if(current(token)){ readFailure(); $("#note").textContent = ""; } }
  finally { clearTimeout(timer); if(current(token)){ busy = false; controls(); revealResult(origin, $("#result").innerHTML ? "#result" : "#completion"); } }
}

async function kidCandidates(data, token){
  photoConsumed = true;
  const items = data.items.filter(it => it.branch !== "same");
  if(!items.length){ emptyResult(data); return; }
  const ready = items.filter(it => it.child === currentChild);
  const unsure = items.filter(it => it.child !== currentChild);
  // 普通の候補はそのまま登録。不明・別の子の候補だけ本人に確かめる。
  if(ready.length) await registerItems(ready, token, false);
  if(!current(token)) return;
  if(unsure.length){
    $("#result").innerHTML = '<h2>だれの ぶん？</h2><p>自分のぶんだけ、入れてね。ほかの子のぶんは、おうちの人に見てもらおう。</p>';
    unsure.forEach(it => {
      const row = document.createElement("div"); row.className = "item";
      row.innerHTML = '<p>'+esc(it.title)+'</p><p>'+esc(it.date)+' · '+esc(it.child || '不明')+'</p>'
        + '<div class="owner-choice"><button class="btn primary">'+esc(currentChild)+'の ぶん</button>'
        + '<button class="btn ghost">いれない</button></div>';
      const buttons = row.querySelectorAll("button");
      buttons[0].addEventListener("click", async () => {
        if(busy || !current(token)) return;
        buttons.forEach(b => b.disabled = true); busy = true; controls();
        // 帰属の確認はこの候補だけ。兄弟の選択・切替UIにはしない。
        await registerItems([{...it, child:currentChild}], token);
        if(current(token)){ row.remove(); busy = false; controls(); }
      });
      buttons[1].addEventListener("click", () => row.remove());
      $("#result").appendChild(row);
    });
    $("#result").insertAdjacentHTML("beforeend", exits());
  }
}
function emptyResult(data){
  $("#result").innerHTML = '<div class="ok">'+(data.skipped ? 'もう入っていたよ' : 'やることは見つからなかったよ')+'</div>'
    + exits() + '<button class="btn ghost" id="another-photo">別の写真</button>';
  $("#another-photo").addEventListener("click", () => $("#album").click());
}

function render(d){
  const KIND = {event:"行事", deadline:"提出期限", homework:"宿題", bring:"持ち物"};
  const BR = {new:"b-new", diff:"b-diff", moved:"b-moved"};
  let h = "<h2>登録候補</h2>";
  h += '<p class="summary">' + esc(d.summary) + "</p>";

  // すでに入っているものは**候補に出さない**（D-33）。毎回承認させると、承認が面倒になる。
  if(d.skipped){
    h += '<p class="skipped">すでに入っているもの ' + d.skipped + "件は、そのままにしました。"
       + '<button type="button" id="showskip">見る</button>'
       + '<span id="skiplist"></span></p>';
  }
  if(!d.items.length){ emptyResult(d); return; }

  // 原本を横に置いたまま確かめる（画面設計 12-1）。撮り直さないと確かめられない、をなくす。
  h += '<div class="withshot"><div class="shot">'
     + (picked ? '<button type="button" id="shot" class="btn ghost" aria-label="原本を拡大"><img src="'+esc(previewURL)+'" alt="撮ったもの"></button>' : "")
     + '<p class="cap">撮ったもの</p></div><div class="list"><div class="items">';

  d.items.forEach((it, index) => {
    const fieldId = "candidate-" + index;
    const br = it.branch || "new";
    const cls = (br==="diff" ? "b_diff" : br==="moved" ? "b_moved" : "") + (it.needs_review ? " review" : "");
    h += '<fieldset class="item ' + cls + '" data-id="' + esc(it.id) + '">'
      + '<legend>候補 ' + (index + 1) + "：" + esc(it.title) + "</legend>"
      + '<div class="item-head">'
        + '<input type="checkbox" data-f="selected"' + (it.selected ? " checked" : "") + ' aria-label="' + esc(it.title) + 'を登録する">'
        + '<label for="'+fieldId+'-title">内容</label><input id="'+fieldId+'-title" class="item-title" data-f="title" value="' + esc(it.title) + '">'
      + "</div>"
      + '<div class="badges">'
        + '<span class="badge ' + (BR[br]||"b-dim") + '">' + esc(it.branch_label || "新規") + "</span>"
        + '<span class="badge b-kind">' + esc(KIND[it.kind] || it.kind) + "</span>"
        + '<button type="button" class="who" data-f="child">' + esc(it.child || "不明") + "</button>"
        + (it.needs_review ? '<span class="badge b-warn">要確認</span>' : "")
      + "</div>"
      + (br==="moved"
          ? '<div class="changes">前は <b>' + esc(it.matched_date||"") + '</b> → <b>' + esc(it.date) + '</b>（' + esc(it.duplicate_of||"") + "）</div>"
          : "")
      + ((it.changes && it.changes.length)
          ? '<div class="changes">' + it.changes.map(c=>"・"+esc(c)).join("<br>") + "</div>"
          : "")
      + '<div class="fields">'
        + '<div><label for="'+fieldId+'-date">日付</label><input id="'+fieldId+'-date" type="date" data-f="date" value="' + esc(it.date) + '"></div>'
        + '<div><label for="'+fieldId+'-time_start">開始時刻</label><input id="'+fieldId+'-time_start" type="text" data-f="time_start" placeholder="終日" value="' + esc(it.time_start||"") + '"></div>'
        + '<div><label for="'+fieldId+'-note">持ち物・補足</label><input id="'+fieldId+'-note" type="text" data-f="note" value="' + esc([...(it.bring||[]), it.note].filter(Boolean).join(" / ")) + '"></div>'
      + "</div>"
      + (it.source_text ? '<div class="src">' + esc(it.source_text) + "</div>" : "")
    + "</fieldset>";
  });
  h += "</div>";
  h += '<div class="row"><button class="btn primary" id="reg">カレンダーに登録する</button>'
     + '<button class="btn ghost" id="all">全部チェック</button><span id="regnote" class="tag"></span></div>';
  h += "</div></div>";
  $("#result").innerHTML = h;

  if(d.skipped) bindSkip(d);
  if($("#shot")) $("#shot").addEventListener("click", () => {
    $("#photo-large").src = previewURL; $("#photo-dialog").showModal();
  });
  $("#all").addEventListener("click", () => {
    document.querySelectorAll('.item input[data-f="selected"]').forEach(c => c.checked = true);
  });
  $("#reg").addEventListener("click", doRegister);

  // どの子かは**推定値を出しておいて、1タップで変える**（FR-2.2）
  document.querySelectorAll('.item .who').forEach(btn => {
    btn.addEventListener("click", () => {
      const names = (window.CHILDREN || []).concat(["不明"]);
      const i = names.indexOf(btn.textContent.trim());
      btn.textContent = names[(i + 1) % names.length];
    });
  });
}

function bindSkip(d){
  const b = document.getElementById("showskip");
  if(!b) return;
  b.addEventListener("click", () => {
    const box = document.getElementById("skiplist");
    if(box.innerHTML){ box.innerHTML = ""; b.textContent = "見る"; return; }
    box.innerHTML = "<ul>" + (d.skipped_titles||[]).map(t=>"<li>"+esc(t)+"</li>").join("") + "</ul>";
    b.textContent = "閉じる";
  });
}

// 成功したIDだけを10分間取り消せる。部分失敗は成功扱いにしない。
let undoIds = [], undoUntil = 0;
function armUndo(ids){
  const btn = $("#undo"), note = $("#undonote"), token = generation;
  if(!btn) return;
  clearInterval(undoTick);
  undoIds = ids; undoUntil = Date.now() + 10*60*1000;
  undoTick = setInterval(() => {
    const left = undoUntil - Date.now();
    if(left <= 0 || !btn.isConnected){ clearInterval(undoTick); btn.remove(); note.textContent = ""; return; }
    note.textContent = "あと" + Math.ceil(left/60000) + "分";
  }, 1000);
  btn.addEventListener("click", async () => {
    if(busy || Date.now() >= undoUntil) return;
    busy = true; controls(); btn.disabled = true; note.textContent = "取り消しています…";
    try{
      const res = await fetch("/api/register/undo", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ids:undoIds})});
      const j = await res.json();
      if(!current(token)) return;
      if(!res.ok || !Array.isArray(j.failed)) throw new Error();
      undoIds = j.failed;
      note.textContent = j.undone + "件を取り消しました。" + (j.failed.length ? j.failed.length + "件は取り消せませんでした。一覧で確認してください。" : "");
      clearInterval(undoTick); btn.remove();
    }catch(err){ if(current(token)){ clearInterval(undoTick); note.textContent = "取り消せたか確認できません。一覧で確認してください。"; btn.remove(); } }
    finally { if(current(token)){ busy = false; controls(); } }
  });
}

function collect(){
  const out = [];
  document.querySelectorAll(".item").forEach(el => {
    const src = extraction.items.find(x => x.id === el.dataset.id);
    if(!el.querySelector('[data-f="selected"]').checked) return;
    const note = el.querySelector('[data-f="note"]').value;
    const who = el.querySelector('[data-f="child"]');
    out.push(Object.assign({}, src, {
      child: who ? who.textContent.trim() : src.child,
      title: el.querySelector('[data-f="title"]').value,
      date: el.querySelector('[data-f="date"]').value,
      time_start: el.querySelector('[data-f="time_start"]').value || null,
      bring: [],
      note: note
    }));
  });
  return out;
}

async function doRegister(){
  if(!canAct() || busy || photoConsumed) return;
  const items = collect();
  if(!items.length){ $("#regnote").textContent = "チェックが入っていません"; return; }
  photoConsumed = true;
  busy = true; controls(); $("#reg").disabled = true;
  const token = generation;
  await registerItems(items, token);
  if(current(token)){ $("#result").innerHTML = ""; busy = false; controls(); }
}
async function registerItems(items, token, reveal = true){
  if(!canAct() || !current(token)) return;
  const origin = document.activeElement;
  // 呼出側で写真・手入力をロックし、応答不明でも一括再送しない。
  $("#note").textContent = "入れているよ";
  try{
    const data = await qPost(items);
    if(!current(token)) return;
    showRegistered(data, items.length);
  }catch(err){
    if(current(token)) $("#completion").insertAdjacentHTML("afterbegin", '<div class="err">入ったか たしかめられなかったよ。もう一度送る前に、一覧で確認してね。</div>'+exits());
  }finally { if(current(token)){ $("#note").textContent = ""; if(reveal) revealResult(origin); } }
}
function showRegistered(data, expected){
  const ok = data.results.filter(r => r.status === "ok");
  const ng = data.results.filter(r => r.status !== "ok");
  const missing = Math.max(0, expected - data.results.length);
  let h = '';
  if(ok.length){
    h += '<div class="ok">'+(isKid() ? 'やることに 入ったよ' : ok.length+' 件をカレンダーに登録しました。')
      + '<ul>'+ok.map(r => '<li>'+esc(isKid() ? (r.title || '').replace(/^[^｜]*｜/, '') : r.title)+'</li>').join('')+'</ul>';
    if(isKid() && data.notice && data.notice.id) h += '<p>おうちの人への知らせをアプリに残したよ</p>';
    h += '</div>';
  }
  if(ng.length || missing) h += '<div class="err">入ったか たしかめられなかったよ。未確認 '+(ng.length+missing)+'件。成功したぶんは送り直さず、一覧で確認してね。<ul>'
    + ng.map(r => '<li>'+esc(r.title)+'</li>').join('')+'</ul></div>';
  h += exits();
  // 以前の成功表示も残す。undo は直近の成功したまとまりにだけ付ける。
  if($("#undo")) $("#undo").remove();
  if($("#undonote")) $("#undonote").remove();
  clearInterval(undoTick);
  const ids = ok.map(r => r.id).filter(Boolean);
  if(ids.length) h += '<button class="btn ghost" id="undo">取り消す</button> <span id="undonote"></span>';
  $("#completion").insertAdjacentHTML("afterbegin", h);
  if(ids.length) armUndo(ids);
}

// ---- 手で入力する ---------------------------------------------------------
// 学校のパソコンを開けない日がある。そこで止まると習慣が切れる（NF-O1）。
// **タイトル1行以外はすべてボタン**にして、5タップで1件入る形にする。
const QSUBJ = {
  elementary: ["こくご", "さんすう", "えいご", "せいかつ", "その他"],
  junior_high: ["国語", "数学", "英語", "社会", "理科", "その他"],
  unknown: ["国語", "算数", "英語", "その他"],
};
let qChildren = [], qSubj = "", qChild = "", qOffset = 0, qKind = "homework", qDate = "";

function qPress(row, el){
  row.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === el)));
}
function qDateISO(){
  if (qDate) return qDate;
  const d = new Date(); d.setDate(d.getDate() + qOffset);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function qLevel(name){
  const c = qChildren.find(x => x.name === name);
  return (c && c.school_level) || "unknown";
}
function qRenderSubjects(){
  const list = QSUBJ[qLevel(qChild)] || QSUBJ.unknown;
  if (!list.includes(qSubj)) qSubj = list[0];
  $("#qsubj").innerHTML = '<span class="lab">きょうか</span>' + list.map(x =>
    '<button type="button" data-s="' + esc(x) + '" aria-pressed="' + (x === qSubj) + '">' + esc(x) + "</button>").join("");
}
function qSetup(children){
  qChildren = children;
  qRenderSubjects();
}

$("#qtoggle").addEventListener("click", () => {
  const box = $("#qbox"), open = box.hidden;
  box.hidden = !open;
  $("#qtoggle").setAttribute("aria-expanded", String(open));
});
$("#qsubj").addEventListener("click", e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  qSubj = b.dataset.s; qPress($("#qsubj"), b);
});
$("#qwhen").addEventListener("click", e => {
  const b = e.target.closest("button[data-o]"); if (!b) return;
  qOffset = +b.dataset.o; qDate = ""; $("#qdate").value = ""; qPress($("#qwhen"), b);
});
$("#qdate").addEventListener("change", e => {
  qDate = e.target.value;
  $("#qwhen").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false"));
});
$("#qkind").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  qKind = b.dataset.k; qPress($("#qkind"), b);
});

async function qPost(items){
  if(!canAct()) throw new Error("だれかを確かめられません");
  const res = await fetch("/api/register", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({items: items, pending: false, source: isKid() ? "kid" : "parent"})
  });
  const j = await res.json();
  if (!res.ok || !Array.isArray(j.results)) throw new Error("登録を確認できませんでした");
  return j;
}

$("#qadd").addEventListener("click", async () => {
  if(!canAct() || busy || manualLocked || !qChild) return;
  const token = generation;
  const extra = $("#qtitle").value.trim();
  const title = qChild + "｜" + qSubj + (extra ? " " + extra : "");
  busy = true; manualLocked = true; controls();
  await registerItems([{title, child:qChild, kind:qKind, date:qDateISO(), note:"手で入力"}], token);
  if(current(token)){ busy = false; controls(); manualNext(); }
});
function manualNext(){
  $("#qnote").innerHTML = '<button type="button" class="qtoggle" id="qnext">別の内容を入れる</button>';
  $("#qnext").addEventListener("click", () => {
    if(busy) return;
    $("#qtitle").value = ""; $("#qnote").textContent = "";
    manualLocked = false; controls(); $("#qtitle").focus();
  });
}

// repeat の既存APIは source と個別の成否を返せないため、既存の予定取得と
// register を組み合わせる。月初も昨日と今日の両方を読み、成功分を再送しない。
function dateISO(date){
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
async function yesterdayItems(child){
  const today = new Date(), yesterday = new Date(today);
  yesterday.setDate(today.getDate()-1);
  const dates = [dateISO(yesterday), dateISO(today)];
  const months = [...new Set(dates.map(d => d.slice(0,7)))];
  const pages = await Promise.all(months.map(async ym => {
    const res = await fetch('/api/schedule?ym='+ym+'&child='+encodeURIComponent(child));
    if(!res.ok) throw new Error();
    const data = await res.json();
    if(!Array.isArray(data.items)) throw new Error();
    return data.items;
  }));
  const rows = pages.flat().filter(r => r.child === child);
  const key = title => (title || '').replace(/[\s✓]/g, '');
  const have = new Set(rows.filter(r => r.date === dates[1]).map(r => key(r.summary)));
  return rows.filter(r => r.date === dates[0] && ['homework','bring'].includes(r.kind)).flatMap(r => {
    const title = (r.summary || '').replace(/✓/g, '').trim();
    if(have.has(key(title))) return [];
    have.add(key(title));
    return [{title, child, kind:r.kind, date:dates[1], note:'昨日と同じぶん'}];
  });
}
$("#qsame").addEventListener("click", async () => {
  if(!canAct() || busy || manualLocked || !qChild) return;
  const token = generation, child = qChild;
  busy = true; controls(); $("#qnote").textContent = "昨日のぶんを見ています…";
  try{
    const items = await yesterdayItems(child);
    if(!current(token)) return;
    if(items.length){ manualLocked = true; await registerItems(items, token); }
    else $("#qnote").textContent = "新しく入れる昨日のぶんはありませんでした。";
  }catch(err){ if(current(token)) $("#qnote").textContent = "昨日のぶんを読み込めませんでした。手でいれることもできます。"; }
  finally { if(current(token)){ busy = false; controls(); if(manualLocked) manualNext(); } }
});
controls();
confirmIdentity();
